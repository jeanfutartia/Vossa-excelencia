<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Vossa Excelência: simulador de carreira política brasileira, de vereador a presidente.">
<meta name="theme-color" content="#090E1A">
<style>:root{color-scheme:dark;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px/1.5 system-ui,-apple-system,'Segoe UI',sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Vossa Excelência</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,500;0,6..96,700;0,6..96,800;1,6..96,500;1,6..96,700&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* Layout: HUD de gabinete noturno — cenário do prédio do cargo com retrato, mostradores circulares, abas no rodapé como app; folhas com ilustração para histórias, sala de guerra com mapa e pesquisas */
:root{
  color-scheme:dark;
  --bg:#090E1A; --panel:#101828; --panel2:#162136; --panel3:#1D2A44; --line:#243250; --ink:#EAEFF8; --muted:#8D9AB6; --faint:#5D6A87;
  --gold:#F2C14E; --gold-ink:#1A1405; --cyan:#38BDF8; --violet:#A78BFA; --teal:#2DD4BF; --slate:#94A3B8; --orange:#FB923C; --lime:#A3E635; --green:#2FD08A; --red:#FF6363; --blue:#5AA9FF; --paper:#EFE8D8; --paper-ink:#1D1A14;
  --display:'Bodoni Moda', Didot, 'Bodoni 72', Georgia, serif;
  --body:'IBM Plex Sans', system-ui, -apple-system, 'Segoe UI', sans-serif;
  --mono:'IBM Plex Mono', ui-monospace, Menlo, Consolas, monospace;
}
*{box-sizing:border-box}
html,body{background:var(--bg)}
body{color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.5;background:radial-gradient(1200px 500px at 50% -120px,#18264A 0%,var(--bg) 70%) fixed,var(--bg)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:60;background:var(--bg)}
button{font:inherit;color:inherit}
button:focus-visible,input:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.wrap{max-width:1120px;margin:0 auto;padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px));padding-block:12px 150px}
h1,h2,h3{font-family:var(--display);font-weight:700;text-wrap:balance;margin:0;line-height:1.08}
.eyebrow{font-family:var(--mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--gold)}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:6px;vertical-align:1px}
.scene{display:block;width:100%;height:100%}
.avatar{display:block;width:100%;height:100%;border-radius:50%}
.av-sm{width:34px;height:34px;flex:none}.av-md{width:48px;height:48px;flex:none}.av-lg{width:72px;height:72px;flex:none}.av-xl{width:84px;height:84px;flex:none}

/* animações */
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes pop{0%{transform:scale(.6);opacity:0}70%{transform:scale(1.08);opacity:1}100%{transform:scale(1)}}
@keyframes floatUp{0%{opacity:0;transform:translateY(6px)}15%{opacity:1}100%{opacity:0;transform:translateY(-22px)}}
@keyframes twinkle{0%,100%{opacity:.15}50%{opacity:.9}}
@keyframes wave{0%,100%{transform:skewY(0)}50%{transform:skewY(-6deg)}}
@keyframes blink{0%,49%{opacity:1}50%,100%{opacity:.15}}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-2.5px)}}
@keyframes smoke{0%{transform:translateY(0) scale(.8);opacity:.5}100%{transform:translateY(-40px) scale(1.6);opacity:0}}
@keyframes spot{0%,100%{opacity:.35}50%{opacity:.8}}
@keyframes flash{0%,88%,100%{opacity:0}90%{opacity:.55}}
@keyframes rainf{from{transform:translate(0,-12px)}to{transform:translate(-4px,12px)}}
@keyframes waves{0%,100%{transform:translateX(0)}50%{transform:translateX(-12px)}}
@keyframes stamp{0%{transform:scale(2.6) rotate(-14deg);opacity:0}60%{transform:scale(.94) rotate(-5deg);opacity:1}100%{transform:scale(1) rotate(-5deg);opacity:1}}
@keyframes confetti{0%{transform:translateY(-20px) rotate(0)}100%{transform:translateY(110vh) rotate(720deg)}}
@keyframes sheetIn{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes qIn{0%{opacity:0;letter-spacing:.4em}100%{opacity:1;letter-spacing:.06em}}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(242,193,78,.5)}50%{box-shadow:0 0 0 8px rgba(242,193,78,0)}}
.tw{animation:twinkle 3s ease-in-out infinite}
.wave{animation:wave 2.4s ease-in-out infinite}
.blink{animation:blink .7s steps(1) infinite}.blink2{animation:blink .7s steps(1) infinite .35s}
.bob{animation:bob 1.6s ease-in-out infinite}
.smoke{animation:smoke 3.2s ease-out infinite}
.spot{animation:spot 2.6s ease-in-out infinite}
.flash{animation:flash 3s linear infinite}
.rain{animation:rainf .5s linear infinite}
.wavey{animation:waves 3s ease-in-out infinite}
.rise{animation:rise .45s cubic-bezier(.2,.7,.2,1) both;animation-delay:calc(var(--i,0)*40ms)}

/* ---------- início ---------- */
.hero{position:relative;border-radius:14px;overflow:hidden;height:250px;border:1px solid var(--line)}
.hero .scene{position:absolute;inset:0}
.hero .over{position:absolute;inset:auto 0 0 0;padding:20px;background:linear-gradient(transparent,rgba(5,8,16,.92) 60%)}
.hero h1{font-size:clamp(40px,10vw,74px);font-style:italic;font-weight:700;letter-spacing:-.01em;color:#fff}
.hero .sub{font-family:var(--display);font-size:clamp(17px,3.6vw,22px);color:var(--gold);font-style:italic}
.intro{display:grid;gap:26px}
.lead{max-width:62ch;color:var(--muted);margin:0}
.step{display:grid;gap:12px}
.step h2{font-size:24px}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.idcard{display:flex;gap:16px;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px;flex-wrap:wrap}
.field{display:flex;flex-direction:column;gap:6px;flex:1 1 220px;min-width:0}
.field input{padding:12px 14px;border:1px solid var(--line);border-radius:8px;background:var(--panel2);color:var(--ink);font:inherit;font-size:16px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;flex-wrap:wrap}
.seg button{border:0;background:var(--panel2);padding:10px 14px;cursor:pointer;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--gold);color:var(--gold-ink);font-weight:600}
.picks{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}
.pick{border:1px solid var(--line);background:var(--panel);border-radius:12px;padding:0;text-align:left;cursor:pointer;display:flex;flex-direction:column;overflow:hidden;min-width:0;transition:transform .2s,border-color .2s}
.pick:hover{transform:translateY(-2px);border-color:var(--faint)}
.pick[aria-pressed="true"]{border-color:var(--gold);box-shadow:0 0 0 1px var(--gold),0 10px 30px rgba(242,193,78,.12)}
.pick .thumb{height:96px}
.pick .pb{padding:12px 14px;display:flex;flex-direction:column;gap:6px}
.pick b{font-family:var(--display);font-size:20px}
.pick .kv{display:grid;grid-template-columns:auto 1fr;gap:2px 10px;font-size:12.5px}
.pick .kv span:nth-child(odd){color:var(--muted)}
.pick small{color:var(--muted);font-size:12.5px}
.pstripe{height:6px}
.chips-sel{display:flex;flex-wrap:wrap;gap:8px}
.chip-sel{border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:9px 15px;cursor:pointer}
.chip-sel[aria-pressed="true"]{background:var(--gold);color:var(--gold-ink);border-color:var(--gold);font-weight:600}
.cta{background:var(--gold);color:var(--gold-ink);border:0;border-radius:10px;padding:13px 22px;font-weight:700;cursor:pointer;font-size:15.5px;transition:transform .12s,filter .2s}
.cta:hover{filter:brightness(1.07)}.cta:active{transform:scale(.97)}
.cta:disabled{opacity:.4;cursor:not-allowed}
.ghost{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:10px 16px;cursor:pointer;color:var(--ink)}
.ghost:disabled{opacity:.4;cursor:not-allowed}
.ghost.sm{padding:7px 11px;font-size:13px;border-radius:8px}

/* ---------- HUD ---------- */
.hud{position:relative;border-radius:14px;overflow:hidden;border:1px solid var(--line);min-height:168px}
.hud .scene{position:absolute;inset:0}
.hud .shade{position:absolute;inset:0;background:linear-gradient(180deg,rgba(6,9,18,.1),rgba(6,9,18,.88) 78%)}
.hud-in{position:relative;display:flex;gap:14px;align-items:flex-end;padding:70px 14px 14px;flex-wrap:wrap}
.hud .id{display:flex;flex-direction:column;gap:2px;min-width:0;flex:1 1 180px}
.hud .trat{font-family:var(--mono);font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--gold)}
.hud h1{font-size:clamp(24px,6vw,34px);font-style:italic;font-weight:700;color:#fff}
.hud .cargo{font-size:14px;color:#C9D2E6}
.pchip{display:inline-flex;align-items:center;gap:6px;font-family:var(--mono);font-size:11.5px;padding:3px 9px;border-radius:999px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.12);width:max-content}
.datebox{display:flex;flex-direction:column;align-items:flex-end;font-family:var(--mono);color:#C9D2E6;font-size:12px;text-align:right}
.datebox b{font-family:var(--display);font-size:22px;color:#fff;font-weight:700}
.gauges{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin-top:10px}
.gauge{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px 6px 8px;display:flex;flex-direction:column;align-items:center;gap:2px;position:relative;min-width:0}
.gauge svg{width:64px;height:64px}
.gauge .ring{transition:stroke-dashoffset 1s cubic-bezier(.2,.8,.2,1)}
.gauge .v{position:absolute;top:30px;font-family:var(--mono);font-size:15px;font-weight:600}
.gauge .l{font-size:11px;color:var(--muted);text-align:center;letter-spacing:.04em}
.bars{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin-top:8px}
@media (max-width:640px){.bars{grid-template-columns:repeat(2,minmax(0,1fr))}.gauge svg{width:56px;height:56px}.gauge .v{top:26px;font-size:14px}}
.mbar{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:8px 10px;display:flex;flex-direction:column;gap:5px;position:relative;min-width:0}
.mbar .t{display:flex;justify-content:space-between;gap:6px;align-items:baseline;font-size:11.5px;color:var(--muted)}
.mbar .t b{font-family:var(--mono);color:var(--ink);font-size:14px;font-weight:600;white-space:nowrap}
.bar{height:6px;background:var(--panel3);border-radius:4px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--green);border-radius:4px;transition:width .8s cubic-bezier(.2,.8,.2,1)}
.bar.risk i{background:var(--red)}.bar.gold i{background:var(--gold)}.bar.blue i{background:var(--blue)}
.bar.big{height:12px}
.dlt{position:absolute;right:8px;top:4px;font-family:var(--mono);font-size:12px;font-weight:600;pointer-events:none;animation:floatUp 1.8s ease-out forwards}
.dlt.up{color:var(--green)}.dlt.dn{color:var(--red)}
.sub3{display:flex;gap:6px;font-family:var(--mono);font-size:10px;color:var(--muted);margin-top:2px}
.notice{margin-top:10px;border:1px solid var(--line);background:var(--panel);border-radius:10px;padding:10px 12px;font-size:13.5px;display:flex;gap:10px;flex-wrap:wrap;justify-content:space-between;align-items:center}
.notice.hot{border-color:var(--gold);background:linear-gradient(90deg,rgba(242,193,78,.12),var(--panel))}

/* ---------- conteúdo ---------- */
.sect{display:grid;gap:12px;margin-top:16px}
.sect>h2{font-size:22px;display:flex;align-items:center;gap:10px}
.cats{display:flex;gap:6px;overflow-x:auto;padding-block:4px 6px;scrollbar-width:none}
.cats::-webkit-scrollbar{display:none}
.cats button{border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:7px 12px;font-size:13px;cursor:pointer;white-space:nowrap;display:flex;align-items:center;gap:6px;color:var(--muted)}
.cats button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.cats .n{font-family:var(--mono);font-size:11px;opacity:.7}
.ico{width:18px;height:18px;flex:none}
.acts{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:10px}
@media (max-width:420px){.acts{grid-template-columns:1fr}}
.act{border:1px solid var(--line);background:var(--panel);border-radius:12px;padding:12px;text-align:left;cursor:pointer;display:grid;grid-template-columns:38px 1fr;gap:4px 12px;min-width:0;transition:transform .15s,border-color .15s,background .15s}
.act:hover:not(:disabled){border-color:var(--gold);background:var(--panel2);transform:translateY(-1px)}
.act:active:not(:disabled){transform:scale(.98)}
.act:disabled{cursor:not-allowed;opacity:.42}
.act .ic{grid-row:span 3;width:38px;height:38px;border-radius:10px;display:grid;place-items:center}
.act .h{display:flex;justify-content:space-between;gap:8px;align-items:baseline;min-width:0}
.act .h b{font-weight:600;font-size:14.5px}
.act .cost{font-family:var(--mono);font-size:11px;color:var(--muted);white-space:nowrap}
.act p{margin:0;font-size:13px;color:var(--muted)}
.act .why{font-size:12px;color:var(--red)}
.fx{display:flex;flex-wrap:wrap;gap:4px}
.fx span{font-family:var(--mono);font-size:11px;padding:2px 7px;border-radius:5px;background:var(--panel3);white-space:nowrap}
.fx .g{color:var(--green)}.fx .b{color:var(--red)}.fx .w{color:var(--gold)}
.res .fx span{animation:pop .4s both}
.res .fx span:nth-child(2){animation-delay:.08s}.res .fx span:nth-child(3){animation-delay:.16s}.res .fx span:nth-child(4){animation-delay:.24s}.res .fx span:nth-child(5){animation-delay:.32s}

.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:10px;min-width:0}
.card h3{font-size:18px}
.card .hd{display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
@media (max-width:760px){.grid2{grid-template-columns:1fr}}
.week{display:grid;grid-template-columns:repeat(6,1fr);gap:4px}
.week span{height:30px;border-radius:6px;background:var(--panel3);display:grid;place-items:center;font-family:var(--mono);font-size:11px;color:var(--muted)}
.week span.done{background:rgba(242,193,78,.25);color:var(--gold)}
.week span.now{background:var(--gold);color:var(--gold-ink);font-weight:700;animation:pulse 2s infinite}
.cand-row{display:grid;grid-template-columns:34px 1fr auto;gap:10px;align-items:center}
.cand-row .nm{min-width:0}
.cand-row .nm b{font-size:13.5px;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cand-row .nm small{font-size:11px;color:var(--muted)}
.cand-row .pc{font-family:var(--mono);font-weight:600;font-size:15px;text-align:right}
.cand-row .pc small{display:block;font-size:10.5px;font-weight:400}
.tr{height:8px;background:var(--panel3);border-radius:4px;overflow:hidden;grid-column:2 / 4}
.tr i{display:block;height:100%;border-radius:4px;transition:width .9s cubic-bezier(.2,.8,.2,1)}
.mapsvg{width:100%;height:auto;display:block}
.mapsvg path{stroke:var(--bg);stroke-width:3;cursor:pointer;transition:fill .5s,opacity .5s}
.mapsvg path.focus{stroke:var(--gold);stroke-width:3.5}
.mapsvg text{font-family:var(--mono);font-size:10px;fill:#fff;pointer-events:none;text-anchor:middle}
.verba{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.verba button{border:1px solid var(--line);background:var(--panel2);border-radius:10px;padding:9px 6px;cursor:pointer;display:flex;flex-direction:column;gap:2px;align-items:center;text-align:center}
.verba button[aria-pressed="true"]{border-color:var(--gold);background:rgba(242,193,78,.14)}
.verba b{font-size:13px}.verba small{font-size:11px;color:var(--muted)}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.kpi{background:var(--panel2);border-radius:10px;padding:8px;display:flex;flex-direction:column;gap:2px}
.kpi small{font-size:10.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.kpi b{font-family:var(--mono);font-size:16px}
.rivals{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px}
.rival{display:flex;gap:10px;align-items:center;background:var(--panel2);border-radius:12px;padding:10px;min-width:0}
.rival.out{opacity:.4}
.rival b{display:block;font-size:14px}.rival small{display:block;font-size:12px;color:var(--muted)}
.chart{width:100%;height:auto;display:block}
.chart text{font-family:var(--mono);font-size:10px;fill:var(--muted)}

.allies{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:10px}
.ally{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:8px}
.ally .top{display:flex;gap:10px;align-items:center}
.ally b{font-size:14.5px;display:block}.ally small{font-size:12px;color:var(--muted);display:block}
.stars{color:var(--gold);font-size:12px;letter-spacing:1px}
.tag{font-family:var(--mono);font-size:10.5px;padding:2px 6px;border-radius:4px;background:rgba(255,99,99,.15);color:var(--red)}
.ally .btns{display:flex;gap:6px;flex-wrap:wrap}
.addcard{border:1.5px dashed var(--line);background:transparent;border-radius:14px;padding:16px;cursor:pointer;display:flex;flex-direction:column;gap:4px;align-items:center;justify-content:center;color:var(--muted);min-height:120px}
.addcard:hover{border-color:var(--gold);color:var(--gold)}
.staff{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:8px}
.staffc{border:1px solid var(--line);background:var(--panel);border-radius:12px;padding:12px;text-align:left;cursor:pointer;display:flex;flex-direction:column;gap:4px}
.staffc[aria-pressed="true"]{border-color:var(--green);background:linear-gradient(180deg,rgba(47,208,138,.1),var(--panel))}
.staffc b{font-size:14px}.staffc small{color:var(--muted);font-size:12.5px}
.hemi{width:100%;max-width:360px;height:auto;display:block;margin:0 auto}
.slots{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:8px}
.slot{border:1px solid var(--line);background:var(--panel);border-radius:12px;padding:10px;text-align:left;cursor:pointer;display:flex;gap:10px;align-items:center;min-width:0}
.slot:hover{border-color:var(--gold)}
.slot.empty{border-style:dashed;border-color:var(--red)}
.slot .sn{min-width:0;flex:1}.slot b{font-size:13.5px;display:block}.slot small{font-size:11.5px;color:var(--muted);display:block}
.ph{width:48px;height:48px;border-radius:50%;background:var(--panel3);display:grid;place-items:center;color:var(--red);font-size:22px;flex:none}

.paper{background:var(--paper);color:var(--paper-ink);border-radius:6px;padding:16px 18px;display:flex;flex-direction:column;gap:8px;box-shadow:0 10px 30px rgba(0,0,0,.35)}
.paper .mast{display:flex;justify-content:space-between;align-items:baseline;border-bottom:3px double var(--paper-ink);padding-bottom:6px;gap:8px;flex-wrap:wrap}
.paper .mast b{font-family:var(--display);font-size:20px;font-weight:800;letter-spacing:.02em}
.paper .mast span{font-family:var(--mono);font-size:10.5px}
.paper h3{font-family:var(--display);font-size:clamp(20px,4.6vw,26px);font-weight:800;line-height:1.1}
.paper .cols{columns:2 220px;column-gap:18px;font-size:13.5px;font-family:Georgia,serif}
.paper .cols p{margin:0 0 8px;break-inside:avoid}
.timeline{display:flex;flex-direction:column;gap:0;border-left:2px solid var(--line);margin-left:8px}
.tl{position:relative;padding:6px 0 14px 18px}
.tl::before{content:"";position:absolute;left:-7px;top:10px;width:12px;height:12px;border-radius:50%;background:var(--gold);box-shadow:0 0 0 3px var(--bg)}
.tl b{font-family:var(--display);font-size:18px}.tl small{display:block;color:var(--muted);font-family:var(--mono);font-size:12px}
.tbl-wrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:13.5px}
th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
th{font-weight:500;color:var(--muted);font-size:11px;letter-spacing:.08em;text-transform:uppercase}
td.n{font-family:var(--mono);font-variant-numeric:tabular-nums;text-align:right}
.prose{max-width:68ch;display:grid;gap:10px}
.prose h3{font-size:20px;margin-top:8px}
.prose p,.prose li{margin:0;font-size:14.5px}
.prose ul{margin:0;padding-left:18px;display:grid;gap:4px}
.formula{font-family:var(--mono);font-size:12px;background:var(--panel2);padding:10px 12px;border-radius:8px;overflow-x:auto;white-space:pre;color:#C9D2E6}

/* ---------- dock ---------- */
.dock{position:fixed;left:0;right:0;bottom:0;z-index:30;background:rgba(9,14,26,.94);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.dock .in{max-width:1120px;margin:0 auto;padding-left:max(12px, env(safe-area-inset-left, 0px));padding-right:max(12px, env(safe-area-inset-right, 0px))}
.dock .act-row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding-block:8px}
.pips{display:flex;align-items:center;gap:6px;font-size:12.5px;color:var(--muted)}
.pips i{width:13px;height:13px;border-radius:50%;border:2px solid var(--gold);display:inline-block;transition:background .3s}
.pips i.on{background:var(--gold)}
.dock .money{font-family:var(--mono);font-size:13px;color:#C9D2E6}
.tabbar{display:grid;grid-template-columns:repeat(5,1fr);border-top:1px solid var(--line)}
.tabbar button{background:none;border:0;padding:7px 2px 8px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;color:var(--faint);cursor:pointer;position:relative}
.tabbar button .ico{width:22px;height:22px}
.tabbar button[aria-selected="true"]{color:var(--gold)}
.tabbar .badge{position:absolute;top:4px;left:calc(50% + 6px);width:8px;height:8px;border-radius:50%;background:var(--red)}

/* ---------- folhas ---------- */
.overlay{position:fixed;inset:0;background:rgba(3,6,12,.72);z-index:50;display:flex;align-items:center;justify-content:center;padding:16px;animation:fadeIn .25s both}
.sheet{background:var(--panel);width:100%;max-width:600px;max-height:90vh;overflow-y:auto;border-radius:16px;border:1px solid var(--line);animation:sheetIn .35s cubic-bezier(.2,.8,.2,1) both;box-shadow:0 30px 80px rgba(0,0,0,.6)}
@media (max-width:560px){.overlay{align-items:flex-end;padding:0}.sheet{border-radius:18px 18px 0 0;max-height:94%;padding-bottom:env(safe-area-inset-bottom,0px)}}
.sheet-scene{position:relative;height:150px;overflow:hidden}
.sheet-scene::after{content:"";position:absolute;inset:0;background:linear-gradient(transparent 40%,var(--panel))}
.sheet-scene .who{position:absolute;left:18px;bottom:-2px;z-index:2;display:flex;align-items:flex-end;gap:10px}
.sheet-scene .who .avatar{box-shadow:0 0 0 3px var(--panel)}
.sheet-scene .who span{font-family:var(--mono);font-size:11px;color:#C9D2E6;padding-bottom:6px}
.vs{position:absolute;inset:0;z-index:2;display:flex;align-items:center;justify-content:center;gap:16px}
.vs b{font-family:var(--display);font-size:34px;color:var(--gold);font-style:italic}
.sheet-pad{padding:18px;display:flex;flex-direction:column;gap:12px}
.sheet h2{font-size:clamp(24px,5.6vw,30px)}
.sheet .txt{font-size:15.5px;margin:0;color:#D5DCEB}
.choices{display:flex;flex-direction:column;gap:8px}
.choice{border:1px solid var(--line);background:var(--panel2);border-radius:12px;padding:12px 14px;text-align:left;cursor:pointer;display:flex;flex-direction:column;gap:5px;transition:border-color .15s,transform .15s;animation:rise .4s both}
.choice:nth-child(2){animation-delay:.06s}.choice:nth-child(3){animation-delay:.12s}.choice:nth-child(4){animation-delay:.18s}.choice:nth-child(5){animation-delay:.24s}
.choice:hover:not(:disabled){border-color:var(--gold);transform:translateX(3px)}
.choice:disabled{opacity:.4;cursor:not-allowed}
.choice b{font-weight:600}.choice small{color:var(--muted);font-size:12.5px}
.row-choice{flex-direction:row;align-items:center;gap:12px}
.row-choice>span{display:flex;flex-direction:column;gap:3px;min-width:0}
.mini{display:grid;gap:3px;font-size:11px;color:var(--muted)}
.mini i{font-style:normal}
.clip{background:var(--paper);color:var(--paper-ink);border-radius:6px;padding:14px 16px;display:flex;flex-direction:column;gap:6px;transform:rotate(-.6deg);animation:pop .45s both}
.clip .m{font-family:var(--mono);font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;border-bottom:2px solid var(--paper-ink);padding-bottom:4px;display:flex;justify-content:space-between}
.clip h3{font-family:var(--display);font-size:22px;font-weight:800}
.clip p{margin:0;font-family:Georgia,serif;font-size:15px}
.clip.bad .m{color:#8E1B1B;border-color:#8E1B1B}
.stamp{align-self:flex-start;font-family:var(--display);font-style:italic;font-weight:700;font-size:32px;padding:4px 16px;border:3px solid currentColor;border-radius:6px;animation:stamp .6s cubic-bezier(.2,.8,.2,1) both}
.stamp.win{color:var(--green)}.stamp.lose{color:var(--red)}.stamp.mid{color:var(--gold)}
.apu{display:flex;flex-direction:column;gap:12px}
.apu .prog{display:flex;justify-content:space-between;font-family:var(--mono);font-size:12px;color:var(--muted)}
.apu .cand-row .pc{min-width:62px}
.cutline{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--gold)}
.ending h2{font-size:clamp(32px,8vw,48px);font-style:italic}
.conf{position:fixed;top:0;width:8px;height:14px;z-index:70;pointer-events:none;animation:confetti linear forwards}
.trans{position:fixed;inset:0;z-index:45;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;background:rgba(5,8,16,.9);animation:fadeIn .25s both;cursor:pointer;padding:24px;text-align:center}
.trans .q{font-family:var(--display);font-size:clamp(40px,11vw,80px);font-weight:800;font-style:italic;color:#fff;animation:qIn .7s both}
.trans .y{font-family:var(--mono);color:var(--gold);letter-spacing:.3em;font-size:14px}
.trans .fx{justify-content:center;max-width:520px}
.trans.out{opacity:0;transition:opacity .4s}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(128px + env(safe-area-inset-bottom,0px));z-index:40;background:var(--panel3);border:1px solid var(--line);color:var(--ink);padding:10px 14px;border-radius:12px;font-size:13.5px;max-width:min(92vw,520px);box-shadow:0 12px 40px rgba(0,0,0,.5);animation:rise .3s both}
.toast.bad{border-color:var(--red)}

.hint{font-size:11.5px;color:var(--faint);margin:6px 2px 0}
.gauge,[data-info]{cursor:pointer}.gauge:hover,.mbar[data-info]:hover{border-color:var(--faint)}
.decs{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
@media (max-width:640px){.decs{grid-template-columns:1fr}}
.dec{border:1px solid var(--gold);background:linear-gradient(135deg,rgba(242,193,78,.10),var(--panel) 55%);border-radius:14px;padding:12px;display:flex;gap:12px;align-items:center;text-align:left;cursor:pointer;min-width:0;transition:transform .15s}
.dec:hover:not(:disabled){transform:translateY(-2px)}
.dec.done{border-color:var(--line);background:var(--panel);cursor:default;opacity:.78}
.dic{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;flex:none}
.dt{display:flex;flex-direction:column;gap:2px;min-width:0;flex:1}.dt b{font-size:14.5px;line-height:1.3}.dt small{font-size:12px;color:var(--muted)}
.dec .ok{color:var(--green);font-size:20px;font-weight:700}
.fx .sg{background:rgba(180,140,255,.14)}.fx .is{background:rgba(90,169,255,.14)}
.big{font-size:30px;font-weight:600}
.stack{display:flex;height:12px;border-radius:6px;overflow:hidden;background:var(--panel3)}.stack i{display:block;height:100%;transition:width .8s}
.segs{gap:12px}
.segrow{display:grid;grid-template-columns:1fr auto;gap:4px 10px;align-items:center}
.segrow .sn b{font-size:14px;display:block}.segrow .sn small{font-size:11.5px;color:var(--muted)}
.segrow .sv{text-align:right}.segrow .sv span{font-size:16px;font-weight:600}.segrow .sv small{display:block;font-size:11px}
.issrow{display:grid;grid-template-columns:96px 1fr;gap:4px 10px;align-items:center;padding-bottom:10px;border-bottom:1px solid var(--line)}
.issrow:last-child{border-bottom:0;padding-bottom:0}
.issrow b{grid-column:1/3;font-size:14px}.issrow .lab{font-size:11px;color:var(--muted)}
.tagg{font-family:var(--mono);font-size:10.5px;padding:2px 6px;border-radius:4px;background:rgba(47,208,138,.15);color:var(--green)}
.ecogrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px}
.np{gap:12px;padding:18px 18px 22px}
.np .mast b{font-size:clamp(24px,6vw,34px)}
.npman{border-bottom:1px solid #00000033;padding-bottom:10px}
.npman h3{font-size:clamp(24px,6vw,36px);line-height:1.05}
.npman p{margin:6px 0 0;font-family:Georgia,serif;font-size:15px}
.npgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px}
@media (max-width:760px){.npgrid{grid-template-columns:1fr}}
.npcol{display:flex;flex-direction:column;gap:6px;min-width:0}
.npcol h4{margin:6px 0 0;font-family:var(--mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;border-bottom:2px solid var(--paper-ink);padding-bottom:3px}
.npcol p{margin:0;font-family:Georgia,serif;font-size:13.5px;line-height:1.45}
.npeco{display:flex;flex-direction:column;gap:3px;font-family:var(--mono);font-size:12px}
.npbox{border:2px solid var(--paper-ink);padding:8px;font-family:var(--mono);font-size:12px;margin-top:6px}
.opin{font-style:italic;font-size:15px!important}.byl{font-family:var(--mono)!important;font-size:11px!important}
.cls{font-size:12px!important;border:1px dashed #00000055;padding:6px}
.np .cats button{background:var(--panel);}

.hud.slim{min-height:0}.hud.slim .hud-in{padding:54px 14px 12px}
.sound{position:absolute;top:10px;right:10px;z-index:3;background:rgba(5,8,16,.55);border:1px solid rgba(255,255,255,.15);border-radius:999px;width:38px;height:38px;cursor:pointer;font-size:17px;line-height:1}
.qstats{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:6px;margin-top:8px}
@media (max-width:640px){.qstats{grid-template-columns:repeat(3,minmax(0,1fr))}}
.qs{position:relative;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:6px 8px;display:flex;flex-direction:column;align-items:flex-start;gap:1px;cursor:pointer;min-width:0;text-align:left}
.qs span{font-size:10.5px;color:var(--muted);letter-spacing:.04em;text-transform:uppercase}.qs b{font-family:var(--mono);font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12px;color:var(--muted)}.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.dec{border-color:var(--tc);background:linear-gradient(135deg,color-mix(in srgb,var(--tc) 14%,transparent),var(--panel) 60%)}
.dec .dic{background:color-mix(in srgb,var(--tc) 18%,transparent);color:var(--tc)}
.dec .tb{color:var(--tc);text-transform:uppercase;letter-spacing:.08em;font-size:11px}
.dec .go{font-size:26px;color:var(--tc);line-height:1}
.dec.done{border-color:var(--line);background:var(--panel)}
.tone-note{margin:0;font-size:12.5px;font-weight:600;color:var(--tc);border-left:3px solid var(--tc);padding-left:8px}
.choice.tone-crise{border-color:rgba(255,99,99,.45);background:linear-gradient(90deg,rgba(255,99,99,.08),var(--panel2))}
.choice.tone-oport{border-color:rgba(47,208,138,.45);background:linear-gradient(90deg,rgba(47,208,138,.08),var(--panel2))}
.choice.tone-crise:hover:not(:disabled){border-color:var(--red)}.choice.tone-oport:hover:not(:disabled){border-color:var(--green)}
.pips i.dp{border-color:var(--c)}.pips i.dp.on{background:var(--c)}
.cta.sm{padding:8px 14px;font-size:13.5px}
.cta.pulse{animation:pulse 1.8s infinite}
.avpick{gap:12px}
.avrow{display:flex;flex-direction:column;gap:6px}
.sugs{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.sug{width:52px;height:52px;border-radius:50%;border:2px solid var(--line);padding:0;background:none;cursor:pointer;overflow:hidden;transition:transform .15s}
.sug:hover{transform:scale(1.08);border-color:var(--gold)}
.sw{display:flex;flex-wrap:wrap;gap:8px}
.swc{width:32px;height:32px;border-radius:50%;border:2px solid var(--line);cursor:pointer}
.swc[aria-pressed="true"]{border-color:var(--gold);box-shadow:0 0 0 2px var(--gold)}
.chip-sel.sm{padding:6px 11px;font-size:13px}
.parties .pick .pb{gap:5px}
.phd{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.phd b{font-size:24px!important}
.pseats{font-family:var(--mono);font-size:12px;color:var(--muted)}
.pesp{font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--ink)}
.spec{position:relative;height:6px;border-radius:3px;background:linear-gradient(90deg,#EF5350,#B0BEC5 50%,#3D8BFD);margin-top:4px}
.spec i{position:absolute;top:-4px;width:14px;height:14px;border-radius:50%;background:#fff;border:3px solid var(--bg);transform:translateX(-50%);box-shadow:0 0 0 1px #fff}
.spec-l{display:flex;justify-content:space-between;font-size:10px;color:var(--faint);font-family:var(--mono)}
.pideo{margin:2px 0;font-size:13px;color:#C9D2E6}
.kv .g{color:var(--green)}.kv .b{color:var(--red)}

/* v5 */
.qs b{color:var(--sc,var(--ink))}
.tabbar{border-top:0}
#fab{position:fixed;right:max(14px,env(safe-area-inset-right,0px));bottom:calc(66px + env(safe-area-inset-bottom,0px));z-index:31}
.fabb{display:flex;align-items:center;gap:10px;border-radius:999px;padding:12px 18px;box-shadow:0 10px 30px rgba(0,0,0,.45)}
.fd{display:flex;gap:4px}.fd i{width:9px;height:9px;border-radius:50%;border:2px solid var(--c);display:inline-block;background:var(--gold)}.fd i.on{background:var(--c)}
.kps{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
@media (max-width:640px){.kps{grid-template-columns:repeat(2,minmax(0,1fr))}}
.kp{position:relative;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px 12px 6px;display:flex;flex-direction:column;gap:2px;text-align:left;cursor:pointer;min-width:0;overflow:hidden}
.kp::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--sc)}
.kl{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.kv2{font-family:var(--mono);font-size:21px;font-weight:600;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kd{font-family:var(--mono);font-size:11.5px}
.spark{width:100%;height:34px;display:block;margin-top:2px;overflow:visible}
.spark-empty{font-size:10.5px;color:var(--faint);height:34px;display:flex;align-items:center}
.alerts{display:grid;gap:8px}
.alert{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;align-items:baseline;background:var(--panel);border:1px solid var(--line);border-left:4px solid var(--zc);border-radius:10px;padding:10px 12px;font-size:13.5px}
.alert b{font-family:var(--mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--zc)}
.z-aband{--zc:var(--red)}.z-exag{--zc:var(--orange)}.z-ok{--zc:var(--green)}
.attmap{width:100%;max-width:560px;height:auto;display:block;margin:6px auto 0}
.attmap .zl{font-family:var(--mono);font-size:9px;letter-spacing:.12em;text-anchor:middle;font-weight:600}
.attmap .ax{font-family:var(--mono);font-size:9.5px;fill:var(--muted);text-anchor:middle}
.attmap .pl{font-family:var(--body);font-size:9.5px;fill:var(--ink)}
.attmap .pt{cursor:pointer}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
@media (max-width:860px){.grid3{grid-template-columns:1fr}}
.arcard{gap:8px}
.arow{display:grid;gap:4px;padding-bottom:8px;border-bottom:1px solid var(--line);cursor:pointer}.arow:last-child{border-bottom:0;padding-bottom:0}
.ah{display:flex;justify-content:space-between;gap:8px;align-items:baseline}.ah b{font-size:13.5px}
.zc{font-family:var(--mono);font-size:10px;padding:2px 6px;border-radius:4px;color:var(--zc);background:color-mix(in srgb,var(--zc) 15%,transparent);white-space:nowrap}
.abars{display:grid;grid-template-columns:70px 1fr;gap:3px 8px;align-items:center;font-size:10.5px;color:var(--muted)}
.cms{gap:0}
.cm{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}.cm:last-child{border-bottom:0}
@media (max-width:560px){.cm{grid-template-columns:1fr}.cm .ct{justify-self:start}}
.ct{font-family:var(--mono);font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--cc);border:1px solid var(--cc);border-radius:4px;padding:2px 6px}
.cb{min-width:0;display:flex;flex-direction:column;gap:2px}.cb b{font-size:14px}.cb small{font-size:12px;color:var(--muted)}
.mud{gap:6px}.mr{display:grid;grid-template-columns:1fr auto auto;gap:12px;font-size:13.5px;align-items:baseline}
.att-ab{color:var(--green)!important;font-weight:600}.att-sat{color:var(--orange)!important}
.later{margin:0;font-size:13px;color:var(--violet)}
.wiz{display:grid;gap:14px}
.wsteps{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.wst{background:none;border:0;display:flex;flex-direction:column;align-items:center;gap:4px;cursor:pointer;color:var(--faint);font-size:11.5px;text-align:center}
.wst i{font-style:normal;width:28px;height:28px;border-radius:50%;display:grid;place-items:center;border:2px solid var(--line);font-family:var(--mono);font-size:12px}
.wst.on{color:var(--gold)}.wst.on i{border-color:var(--gold);background:var(--gold);color:var(--gold-ink)}
.wst.done{color:var(--muted)}.wst.done i{border-color:var(--green);color:var(--green)}
.spv{display:flex;gap:14px;align-items:center;background:linear-gradient(135deg,rgba(242,193,78,.10),var(--panel));border:1px solid var(--line);border-radius:14px;padding:12px 14px}
.spv>div:last-child{display:flex;flex-direction:column;gap:3px}
.spv-n{font-family:var(--display);font-size:24px;font-style:italic}
.spv small{color:var(--muted);font-size:12.5px}
.wbody{gap:14px}.wbody h2{font-size:24px}
.wnav{display:flex;justify-content:space-between;gap:10px}

/* v6 */
.cdet{flex-direction:row;gap:14px;flex-wrap:wrap;padding:0;overflow:hidden}
.cthumb{flex:1 1 220px;min-height:130px;max-height:200px}
.cinfo{flex:2 1 280px;padding:12px 14px;display:flex;flex-direction:column;gap:4px;min-width:0}

.clist{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:6px;max-height:420px;overflow-y:auto;padding-right:2px}
.crow{display:grid;grid-template-columns:1fr auto auto;gap:10px;align-items:center;text-align:left;border:1px solid var(--line);background:var(--panel2);border-radius:10px;padding:8px 10px;cursor:pointer;min-width:0}
.crow:hover{border-color:var(--faint)}.crow[aria-pressed="true"]{border-color:var(--gold);box-shadow:0 0 0 1px var(--gold)}
.crow .cn{min-width:0}.crow .cn b{display:block;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.crow .cn small{font-size:11.5px;color:var(--muted)}
.crow .cp{font-size:11.5px;color:var(--muted)}.crow .cd{font-size:9px;letter-spacing:1px;color:var(--orange)}
.bscale{display:flex;justify-content:space-between;font-family:var(--mono);font-size:11px;margin-top:8px}

// ---------- hemiciclo ----------
function hemicycle(groups){ // groups: [{color,n,dim}]
  const total=groups.reduce((a,g)=>a+g.n,0); const rows=5, pts=[];
  const radii=Array.from({length:rows},(_,i)=>60+i*14), lens=radii.map(r=>r), L=lens.reduce((a,b)=>a+b,0);
  radii.forEach(r=>{const k=Math.round(total*r/L);for(let j=0;j<k;j++){const a=Math.PI*(j+.5)/k;pts.push({a,x:160-Math.cos(a)*r,y:140-Math.sin(a)*r})}});
  while(pts.length>total) pts.pop(); while(pts.length<total) pts.push({a:Math.PI/2,x:160,y:140-60});
  pts.sort((p,q)=>p.a-q.a); let i=0,s='';
  for(const g of groups) for(let j=0;j<g.n;j++){const p=pts[i++]; if(!p) break; s+=`<circle cx="${p.x.toFixed(1)}" cy="${p.y.toFixed(1)}" r="4.6" fill="${g.color}" opacity="${g.dim?.25:1}"/>`}
  return `<svg viewBox="0 0 320 150" class="hemi" role="img" aria-label="Composição da Casa">${s}</svg>`;
}

function randn(){let u=0,v=0;while(!u)u=rnd();while(!v)v=rnd();return Math.sqrt(-2*Math.log(u))*Math.cos(2*Math.PI*v)}
const pick=a=>a[Math.floor(rnd()*a.length)];
const esc=t=>String(t).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

function genderize(t,g){const f=(g||(S&&S.gen))==='f';return String(t).replace(/(\w*)o\(a\)/g,f?'$1a':'$1o').replace(/\(a\)/g,f?'a':'')}
function whoMatch(who,o){

}

// ---------- NPCs ----------
function npc(o){
  o=o||{}; S.npcN=(S.npcN||0)+1;
  const gen=o.gen||(rnd()<.45?'f':'m');
  const prof=PROFILES.find(p=>p.k===o.prof)||pick(PROFILES);
  const first=pick(gen==='f'?NF:NM), sur=pick(SUR);
  let name;
  if(o.low&&rnd()<.45) name=`${first} ${pick(NICK)}`;
  else if(prof.title&&rnd()<.55){const t=pick(prof.title); name=`${gen==='f'?t[1]:t[0]} ${first} ${sur}`}
  else name=`${first} ${sur}`;
  const parties=Object.keys(PARTIES).filter(k=>k!==S.party);
  return {id:'n'+S.npcN,name,gen,prof:prof.k,party:o.party!==undefined?o.party:pick(parties),seed:name+S.npcN};
}

// ---------- efeitos ----------
function applyFx(fx,ctx){
  ctx=ctx||{}; const out={}; if(!fx) return out;
  const P=PARTIES[S.party],Ar=ARCH[S.arch],m=ctx.mult??1;
  for(const k in fx){
    let v=fx[k]; if(!v) continue;
    if(k.includes(':')){ const [t,x]=k.split(':'); const W=S.world;
      if(t==='s'){ const b=S.seg[x]??30; const vv=v>0?v*m*(ctx.passive?1:dim(b)):v; S.seg[x]=clamp(b+vv,0,100); out[k]=S.seg[x]-b; }
      else if(t==='o'){ const b=W.own[x]; W.own[x]=clamp(b+v*(v>0?m:1),0,100); out[k]=W.own[x]-b; }
      else if(t==='h'){ W.heat[x]=clamp(W.heat[x]+v,5,100); }
      continue; }
    if(k==='f'&&OFF[S.office].type==='exec'&&S.world){ const lv={pres:1,gov:.35,pref:.12}[S.office]||0; const P2=S.world.push=S.world.push||{pib:0,infl:0}; P2.pib+=-v*0.03*lv; P2.infl+=-v*0.02*lv; }
    if(k==='$'){ v=v*sc(); if(v>0&&!ctx.passive){ if(S.party==='avanca'&&ctx.cat==='dinheiro'&&!ctx.illegal) v*=1.5; if(S.staff.tes) v*=1.15; }
      v=Math.round(v); S.money+=v; if(v<0&&inCampaign()) S.campaign.spend+=-v/sc(); out.$=(out.$||0)+v; continue; }
    if(k==='camp'){ const c=S.campaign; if(c){ if(v>0){ v*=m; if(S.staff.marq) v*=1.25; } c.camp+=v; if(v>0&&inCampaign()) c.field.effort[c.focus]+=v*0.6; out.camp=(out.camp||0)+v; } continue; }
    const keys=k==='ap'?['aa','am','apo']:[k];
    for(const kk of keys){
      let vv=v;
      if(vv>0&&!ctx.passive){ vv*=(P.mult[kk]||1)*((Ar.mult||{})[kk]||1); if(ctx.cat) vv*=((P.catMult||{})[ctx.cat]||1)*((Ar.catMult||{})[ctx.cat]||1); if(kk!=='rj') vv*=m; }
      const ci=CLS.indexOf(kk);
      if(ci>=0){ const b=classAP(ci); for(const sg in SEG){ const w=SEG[sg].mix[ci]; if(!w) continue; const cur=S.seg[sg]??30; const dv=vv*w*1.35*(vv>0&&!ctx.passive?dim(cur):1); S.seg[sg]=clamp(cur+dv,0,100); } out[kk]=(out[kk]||0)+(classAP(ci)-b); continue; }
      const b=S.stats[kk]; if(vv>0&&!ctx.passive&&kk!=='rj'&&kk!=='f') vv*=dim(b); S.stats[kk]=clamp(b+vv,0,100); out[kk]=(out[kk]||0)+(S.stats[kk]-b);
    }
  }
  return out;
}
function chip(k,v,money){
  if(!v||Math.abs(v)<0.05) return '';
  if(k.startsWith('h:')||k.startsWith('w:')) return '';
  if(k==='camp'&&!money) return `<span class="${v>0?'g':'b'}">Campanha ${v>0?'▲':'▼'}</span>`;
  if(k.startsWith('s:')||k.startsWith('o:')){ const x=k.slice(2), lab=k[0]==='s'?SEG[x].n:'Pauta '+ISS[x].n.toLowerCase(); if(!money) return `<span class="${v>0?'g':'b'} ${k[0]==='s'?'sg':'is'}">${lab} ${v>0?'▲':'▼'}</span>`; const n=Math.round(v); if(!n) return ''; return `<span class="${n>0?'g':'b'} ${k[0]==='s'?'sg':'is'}">${lab} ${n>0?'+':'−'}${Math.abs(n)}</span>`; }
  if(k==='$'){ if(!money) return `<span class="${v>=0?'g':'b'}">Caixa ${v>0?'▲':'▼'}</span>`; const n=Math.round(v);if(!n)return '';return `<span class="${n>=0?'g':'b'}">R$ ${n>0?'+':'−'}${fmt(Math.abs(n))} mil</span>`}
  const bad=k==='rj'?v>0:v<0;
  if(!money) return `<span class="${bad?'b':'g'}">${LBL[k]} ${v>0?'▲':'▼'}</span>`;
  const n=Math.abs(v)<1?(Math.abs(v)).toFixed(1).replace('.',','):Math.round(Math.abs(v));
  return `<span class="${bad?'b':'g'}">${LBL[k]} ${v>0?'+':'−'}${n}</span>`;
}
function dim(cur){ return cur<50?1:Math.max(0.15,1-Math.pow((cur-50)/50,1.5)*0.85); }
const CLS=['aa','am','apo'];
function fxHTML(fx,applied){ if(!fx) return ''; let h=''; for(const k in fx) h+=chip(k,fx[k],applied); return h?`<div class="fx">${h}</div>`:'' }

function newGame(){
  const c=SETUP, st={cp:10,ip:10,et:60,rj:0,pt:50,f:50};
  let money=40; const a=ARCH[c.arch].start;
  const clsStart={}; for(const k in a){ if(k==='money') money+=a[k]; else if(CLS.includes(k)) clsStart[k]=a[k]; else st[k]=clamp(st[k]+a[k],0,100); }
  const nome=c.nome.trim()||(c.gen==='f'?'Helena Duarte':'Rafael Duarte');
  S={v:SAVE_VER,look:c.look||randomLook(c.gen,nome),nome,gen:c.gen,seed:'me-'+nome,city:c.city,party:c.party,arch:c.arch,
    year:2028,q:1,age:25,tick:0,office:'none',officeEnds:null,maxLvl:0,stats:st,money,flags:{},seen:{},used:{},doneQ:{},onceDone:{},
    apLeft:99,log:[],career:[],elections:[],lostStreak:0,campaign:null,phase:'gov',poll:null,execStreak:0,presTerms:0,
    allies:[],staff:{},cabinet:null,cabOffer:null,ended:null,npcN:0,qStart:null,promises:[],obras:[],pending:[],att:{},attLog:[],lastAtt:{},hist:[],tut:0};

  S.partyHist=[c.party]; S.bio=makeOrigin(); setStateHeat(); initWorld(); initGovs(); const aff=PARTIES[c.party].aff||{}; for(const k in aff) S.seg[k]+=aff[k]; applyFx(clsStart,{passive:true}); initRivals(); S.segPrev=segSnap(); pushHist(); genDecisions(); publishPoll();

// ---------- ações ----------
const CAMP_CATS=['camp','base','midia','dinheiro','juridico','partido'];
function canDo(a){
  if(!inCampaign()&&a.id!=='pesquisa') return {ok:false,hide:true};
  if(!whoMatch(a.who)) return {ok:false,hide:true};
  if(a.o.camp&&!inCampaign()) return {ok:false,hide:true};
  if(inCampaign()&&!CAMP_CATS.includes(a.cat)) return {ok:false,hide:true};
  if(inCampaign()&&a.o.special==='trocar') return {ok:false,hide:true};
  if(a.o.once&&S.onceDone[a.id]) return {ok:false,hide:true};
  const cost=a.o.ap||1;
  if(S.doneQ[a.id]) return {ok:false,why:inCampaign()?'Já feito nesta semana':'Já feito neste trimestre'};
  if(a.o.req&&!a.o.req(S.stats)) return {ok:false,why:a.o.reqTxt};
  const m=(a.fx.$||0)*sc(); if(m<0&&S.money+m<0) return {ok:false,why:'Caixa insuficiente'};
  if(inCampaign()&&S.apLeft<cost) return {ok:false,why:`Exige ${cost} ações nesta semana`};
  return {ok:true};
}
function recentUses(id){return (S.used[id]||[]).filter(t=>t>=S.tick-3).length}
function doAction(id){
  const a=ACT[id]; if(!canDo(a).ok) return;
  if(a.o.special==='trocar') return showTrocar();
  if(inCampaign()) S.apLeft-=(a.o.ap||1); S.doneQ[id]=1; if(a.o.once) S.onceDone[id]=1;
  const mult=1/(1+0.5*recentUses(id)); (S.used[id]=S.used[id]||[]).push(S.tick);
  const out=applyFx(a.fx,{cat:a.cat,mult,illegal:a.o.illegal});
  if(a.o.set) S.flags[a.o.set]=(S.flags[a.o.set]||0)+1;
  noteAttention(out);
  let msg=genderize(a.n), bad=false;
  let p=a.o.risk?a.o.risk.p:0; if(a.cat==='midia'&&S.staff.imp) p/=2;
  if(a.o.risk&&rnd()<p){ const o2=applyFx(a.o.risk.fx); for(const k in o2) out[k]=(out[k]||0)+o2[k]; msg+='. '+genderize(a.o.risk.msg); bad=true; }
  log(msg+(mult<1&&!bad?' (efeito reduzido por repetição)':''),bad?'bad':'');
  if(a.o.special==='pesquisa'){ save(); renderGame(); return showPesquisa(); }
  toast(msg,out,bad); bad?SFX.bad():SFX.coin(); save(); renderGame();
}

// ---------- aliados ----------
function addAlly(t,o){
  o=o||{}; const d=ALLY_DEF[t]; const p=npc({gen:o.gen,party:S.party,prof:d.prof});
  const a={id:p.id,t,name:o.name||p.name,gen:p.gen,seed:p.seed,party:S.party,loy:o.loy??55,pow:o.pow??(S.stats.cp>60?3:S.stats.cp>30?2:1),shady:o.shady??(rnd()<.25),cd:0,gift:-9};
  a.rumor=a.shady&&rnd()<.6; S.allies.push(a);
  if(!o.silent) log(`${a.name} (${genderize(d.n,a.gen)}) passa a ser seu aliado.`,'elec');
  return a;
}
function maxAllies(){return 3+S.maxLvl}
function allyFavor(id){
  const a=S.allies.find(x=>x.id===id); if(!a||a.cd>0||a.loy<20) return; if(!spendAP()) return;
  const d=ALLY_DEF[a.t]; a.loy-=18; a.cd=2;
  const fx=(a.shady&&d.shadyFx)?d.shadyFx:d.fx; const out=applyFx(scaleFx(fx,0.6+0.4*a.pow));
  noteAttention(out,'ally'); const msg=`${a.name}: ${d.favor.toLowerCase()}`; log(msg); toast(msg,out); SFX.good(); save(); renderGame();
}
function allyGift(id){
  const a=S.allies.find(x=>x.id===id); const cost=Math.round(5*sc()); if(!a||S.money<cost||a.gift===S.tick) return;
  S.money-=cost; a.loy=clamp(a.loy+15,0,100); a.gift=S.tick; noteAttention({},'ally'); toast(`Jantar com ${a.name}. Lealdade em alta.`); save(); renderGame();
}
function showRecruit(){
  if(S.doneQ.recruit) return toast('Você já recrutou alguém neste trimestre.');
  if(inCampaign()&&S.apLeft<1) return toast('Sem ações livres nesta semana.');
  const owned=S.allies.map(a=>a.t); let types=Object.keys(ALLY_DEF).filter(t=>!owned.includes(t)); if(types.length<3) types=Object.keys(ALLY_DEF);

function cabSlots(){return SLOTS[S.office]||[]}
function cabTitle(k){return S.office==='pres'?PORTF[k].min:(S.office==='gov'?'Secretaria de ':'Secretaria de ')+PORTF[k].n}
function startCabinet(){ S.cabinet={}; cabSlots().forEach(k=>S.cabinet[k]=null); S.cabFree={}; }
function cabOffers(k){
  const others=Object.keys(PARTIES).filter(p=>p!==S.party);
  const wpick=()=>{let r=rnd()*others.reduce((a,p)=>a+PARTIES[p].seats,0);for(const p of others){r-=PARTIES[p].seats;if(r<=0)return p}return others[0]};
  const p1=wpick(); let p2=wpick(); if(p2===p1) p2=others.find(p=>p!==p1);
  const mk=(party,comp,corr)=>Object.assign(npc({party,prof:party?pick(['dinastia','empresario','populista','sindical']):'tecnico'}),{party,comp:Math.round(comp),corr:Math.round(corr)});
  return [mk(null,62+rnd()*28,4+rnd()*10),mk(S.party,40+rnd()*28,12+rnd()*25),mk(p1,30+rnd()*30,18+rnd()*35),mk(p2,30+rnd()*30,18+rnd()*35)];
}
function coalition(){
  const parts={}; for(const k in (S.cabinet||{})){const a=S.cabinet[k]; if(a&&a.party&&a.party!==S.party) parts[a.party]=(parts[a.party]||0)+1;}
  let base=PARTIES[S.party].seats; const sat={};
  for(const p in parts){ const need=Math.max(1,Math.round(PARTIES[p].seats/12)); sat[p]=Math.min(1,parts[p]/need); base+=PARTIES[p].seats*sat[p]; }
  return {base,parts,sat};
}

// ---------- eleições: campo, regiões, votos ----------
function sys(k){const o=OFF[k]; if(k==='pref') return CITIES[S.city].twoRound?'maj2':'maj1'; if(o.sys==='maj') return 'maj1'; return o.sys}
function regionsFor(k){ if(k==='ver'||k==='pref') return REGIONS[S.city]; if(k==='pres') return REGIONS.brasil; return REGIONS.estado }
function placeName(k){ if(k==='ver'||k==='pref') return CITIES[S.city].n; if(k==='pres') return 'Brasil'; return 'Estado de '+CITIES[S.city].uf }
function electorate(k){const c=CITIES[S.city]; if(k==='ver'||k==='pref') return c.elec; if(k==='pres') return 158000000; return c.stElec}
function qe(k){const c=CITIES[S.city]; if(k==='ver') return c.qe; const seats=k==='dfed'?c.dfedSeats:c.destSeats; return Math.round(c.stElec*0.78/seats)}
function diffOf(k){let d=OFF[k].diff; if(k==='ver') d+=CITIES[S.city].verMod; if(k==='pref') d+=CITIES[S.city].prefMod; if(k==='pres'&&!['gov','sen','pres'].includes(S.office)) d+=3; return d}
function rejection(){const st=S.stats;return Math.max(0,55-st.et)*0.35+Math.max(0,st.rj-30)*0.3}
function eligible(k,y){
  y=y||S.year; const o=OFF[k];
  if(o.el!==elecType(y)) return {ok:false};
  if(S.age<o.min) return {ok:false,why:`Idade mínima de ${o.min} anos`};
  if(o.type==='exec'&&S.office===k&&S.execStreak>=2) return {ok:false,why:'Já reeleito(a): terceiro mandato seguido é vedado'};
  if(S.office==='sen'&&k==='sen'&&S.officeEnds!==y) return {ok:false,why:'Seu mandato de senador(a) ainda não termina'};
  if(o.sys!=='prop'&&S.stats.pt<30) return {ok:false,why:'O partido nega a legenda (Partido abaixo de 30)'};
  if(S.office===k) return {ok:true};
  if(k==='pres'&&S.maxLvl<4) return {ok:false,why:'O partido só lança à Presidência quem já foi deputado federal, senador ou governador'};
  if(k==='pres'&&S.stats.cp<42) return {ok:false,why:'Falta peso político: o partido exige Capital 42+ para a Presidência'};
  if((k==='gov'||k==='sen')&&S.maxLvl<2) return {ok:false,why:'O partido exige experiência como prefeito ou deputado'};
  if((k==='gov'||k==='sen')&&S.stats.cp<30) return {ok:false,why:'Falta peso político: o partido exige Capital 30+'};
  return {ok:true};
}
function genField(k){
  const s=sys(k), regs=regionsFor(k), d=diffOf(k);
  const n={ver:3,pref:3,dest:3,dfed:3,sen:3,gov:4,pres:5}[k];
  const cands=[{id:'me',isMe:true,name:S.nome,gen:S.gen,seed:S.seed,party:S.party}];
  for(let i=0;i<n;i++){
    let c;
    if(s==='prop') c=npc({party:S.party,low:k==='ver'});
    else if(i===0) c=Object.assign({},S.nemesis);
    else if(i===1&&S.rivals&&S.rivals[0]) c=Object.assign({},S.rivals[0]);
    else c=npc({low:k==='pref'&&CITIES[S.city].elec<50000});
    c.base=s==='prop'?0:d+(i===0?3+(c.elo||0):-3-i*3)+randn()*3;
    c.home=Math.floor(rnd()*regs.length); c.mom=0; c.out=false;
    if(s==='prop') c.vf=[1.3,1.02,0.82][i]*(1+randn()*0.08);
    cands.push(c);
  }
  return {cands,regs,effort:regs.map(()=>0)};
}
function hypoCC(k){return {camp:50,spend:40,effort:regionsFor(k).map(()=>6)}}
function myScore(k,r,ri,cc){
  const st=S.stats,o=OFF[k],P=PARTIES[S.party];
  const apr=classAP(0)*r.mix[0]+classAP(1)*r.mix[1]+classAP(2)*r.mix[2];
  let b=0.42*apr+0.18*st.cp+0.1*st.ip+0.08*st.pt+(sys(k)==='prop'?P.fit.prop:P.fit.maj)-rejection();
  if(S.office===k) b+=o.type==='exec'?(st.f>=45?6:-3):5;
  if(cc){ const ef=cc.effort||(cc.field&&cc.field.effort)||[]; b+=cc.camp*0.12+(ef[ri]||0)*0.3+1.6*Math.log(1+cc.spend); }
  return b;
}
function rivalScore(c,r,ri){ const p=PROFILES.find(x=>x.k===c.prof); const bias=p?p.bias[0]*r.mix[0]+p.bias[1]*r.mix[1]+p.bias[2]*r.mix[2]:0; return c.base+c.mom+(c.home===ri?5:0)+12*(bias-0.08) }
function fieldShares(k,f,cc,noise,only,bonus){
  const alive=only||f.cands.filter(c=>!c.out);
  const g=alive.map(()=>noise?randn()*2.6:0);
  const perReg=f.regs.map((r,ri)=>{ const v=alive.map((c,i)=>(c.isMe?myScore(k,r,ri,cc)+(bonus||0):rivalScore(c,r,ri))+g[i]+(noise?randn()*1.6:0)); const mx=Math.max(...v); const ex=v.map(x=>Math.exp((x-mx)/6.5)); const t=ex.reduce((a,b)=>a+b,0); return ex.map(x=>x/t); });
  const tot=alive.map((c,i)=>f.regs.reduce((a,r,ri)=>a+r.w*perReg[ri][i],0));
  return {alive,perReg,tot};
}
function propResult(k,f,cc,noise){
  const Q=qe(k); let cut=Q*(0.9-PARTIES[S.party].seats/100*1.1); if(F('puxador')) cut*=0.85;
  const avg=f.regs.reduce((a,r,ri)=>a+r.w*myScore(k,r,ri,cc),0);
  const x=(avg-diffOf(k))/8+(noise?randn()*0.45:0);
  const votes=Q*0.62*Math.exp(0.85*x);
  const sh=f.regs.map((r,ri)=>r.w*Math.exp(myScore(k,r,ri,cc)/12)); const st=sh.reduce((a,b)=>a+b,0);
  const rivals=f.cands.filter(c=>!c.isMe).map(c=>({c,votes:cut*c.vf}));
  return {sys:'prop',x,votes,cut,qe:Q,win:votes>=cut&&votes>=Q*0.1,regVotes:sh.map(v=>votes*v/st),rivals};
}
function majResult(k,f,cc,noise,only,bonus){
  const r=fieldShares(k,f,cc,noise,only,bonus);
  const order=r.alive.map((c,i)=>({c,s:r.tot[i],i})).sort((a,b)=>b.s-a.s);
  const me=order.find(o=>o.c.isMe), mePos=order.indexOf(me);
  const s=sys(k);
  let win=false,second=false;
  if(only) win=mePos===0;
  else if(me.s>0.5) win=true;
  else if(s==='maj1') win=mePos===0;
  else second=mePos<=1;
  return {sys:s,shares:r,order,win,second,me};
}
function winChance(k,cc,f,n){
  n=n||80; let w=0;
  for(let i=0;i<n;i++){
    const ff=f||genField(k);
    if(sys(k)==='prop'){ if(propResult(k,ff,cc,true).win) w++; continue; }
    const r=majResult(k,ff,cc,true);
    if(r.win) w++; else if(r.second){ const top2=r.order.slice(0,2).map(o=>o.c); if(majResult(k,ff,cc,true,top2).win) w++; }
  }
  if(!f) S.npcN-=0; return w/n;
}
function pushPoll(){
  const c=S.campaign, k=c.off;
  if(sys(k)==='prop'){ const r=propResult(k,c.field,c,false); c.polls.push({w:c.week,votes:r.votes*(1+randn()*0.05),cut:r.cut}); return; }
  const r=fieldShares(k,c.field,c,false); const s={}; r.alive.forEach((x,i)=>s[x.id]=clamp(r.tot[i]+randn()*0.012,0.005,0.95));
  c.polls.push({w:c.week,s});
}

// ---------- trimestre ----------
function drift(){
  const st=S.stats, o=off();
  worldStep();
  S.money+=Math.round((S.office==='none'?2:4)*sc());
  const sal=Math.round(staffCost()); if(sal){ S.money-=sal; if(S.money<0){ const k=Object.keys(S.staff).sort((a,b)=>STAFF[b].sal-STAFF[a].sal)[0]; delete S.staff[k]; log(`Sem caixa, você dispensou o ${STAFF[k].n.toLowerCase()}.`,'bad'); } }
  if(S.staff.adv) st.rj=clamp(st.rj-1,0,100);
  for(const k in S.seg){ const v=S.seg[k]; if(v>35) S.seg[k]=v-(0.5+(v-35)*0.06); else if(v<26) S.seg[k]=v+0.6; }
  const up=Math.max(0,S.money-60*sc())*0.04; if(up>=1){ S.money-=Math.round(up); }
  if(o.type!=='exec'&&st.ip>30) st.ip-=0.5+(st.ip-30)*0.05;
  if(st.cp>20) st.cp-=(st.cp-20)*0.05+Math.max(0,st.cp-60)*0.04; if(S.office==='none'&&st.cp>10) st.cp-=0.8; if(S.office!=='none') st.cp+=0.1*o.lvl;
  if(S.party==='pcn') st.pt-=0.8; if(st.pt>50) st.pt-=0.3+(st.pt-50)*0.05;
  if(st.rj>0) st.rj-=st.et>=60?1:0.4;
  if(st.et<50) st.et+=0.4;
  if(o.type==='exec'){ st.f-=1; if(st.f<25){ ['per','idosos','serv','media'].forEach(k=>S.seg[k]=clamp(S.seg[k]-1.1,0,100)); } if(st.f>75) S.seg.elite=clamp(S.seg.elite+0.5,0,100); }
  for(const k in st) st[k]=clamp(st[k],0,100);
  const e1=processAllies(), e2=processCabinet();
  return e1||e2;
}
function endTurn(){
  if(S.ended||$('.overlay')) return;
  if(inCampaign()) return endWeek();
  const pend=pendingDecisions(); if(pend.length){ toast(`Faltam ${pend.length} ${pend.length===1?'decisão':'decisões'} neste trimestre.`); return openDecision(S.dec.indexOf(pend[0])); }
  const extra=drift();
  QUEUE=[];
  const crisis=checkCrisis();
  if(crisis) QUEUE.push({type:'event',ev:crisis});
  if(extra) QUEUE.push({type:'event',ev:extra});
  if(elecType(S.year)&&S.q===3) QUEUE.push({type:'termcheck'});
  if(elecType(S.year)&&S.q===2) QUEUE.push({type:'convention'});
  QUEUE.push({type:'paper'});
  QUEUE.push({type:'advance'});
  runQueue();
}
function endWeek(){
  const c=S.campaign, V=VERBA[c.verba], cost=Math.round(V.cost*OFF[c.off].sc);
  if(S.money>=cost){ S.money-=cost; c.spend+=V.cost; if(V.camp) applyFx({camp:V.camp}); c.field.effort[c.focus]+=V.eff*(S.staff.marq?1.25:1); }
  else log('Sem caixa para a verba da semana: só militância nas ruas.','bad');
  const rivals=c.field.cands.filter(x=>!x.isMe&&!x.out);
  rivals.forEach((r,i)=>{ r.mom+=(i===0?1.5:1.1)+randn()*1.1; });
  c.week++; S.tick++; S.doneQ={}; S.apLeft=apMaxNow();
  pushPoll();
  QUEUE=[];
  const maj=sys(c.off)!=='prop';
  if(c.week===4&&maj) QUEUE.push({type:'event',ev:debateEvent()});
  else QUEUE.push({type:'event',ev:(maj&&rnd()<.55)?rivalEvent():campEvent()});
  if(c.week>=c.weeks){ QUEUE.push({type:'election'}); QUEUE.push({type:'endcamp'}); }
  else QUEUE.push({type:'week'});
  runQueue();
}
function runQueue(){
  closeModal(); if(S.ended){ QUEUE=[]; save(); renderGame(); return showEnding(); }
  const it=QUEUE.shift(); if(!it){ save(); renderGame(); return; }
  if(it.type==='event') return showEvent(it.ev);
  if(it.type==='election') return runElection();
  if(it.type==='termcheck'){ termCheck(); return runQueue(); }
  if(it.type==='convention') return showConvention();
  if(it.type==='week'){ save(); renderGame(); showWeekBanner(); return runQueue(); }
  if(it.type==='paper'){ makePaper(); return runQueue(); }
  if(it.type==='endcamp'){ S.phase='gov'; drift(); makePaper(); QUEUE.unshift({type:'advance'}); return runQueue(); }
  if(it.type==='advance'){ advance(); checkEndings(); save(); renderGame(); if(S.ended) return showEnding(); showTransition(); return runQueue(); }
}
function advance(){
  S.q++; if(S.q>4){S.q=1;S.year++;S.age++;}

function checkEndings(){

}
function checkCrisis(){

}

// ---------- convenção ----------

function startCampaign(k){

  const pf=(S.pre&&S.pre.off===k&&S.pre.y===S.year)?S.pre.field:genField(k);

// ---------- eleição ----------
function runElection(){
  const c=S.campaign, k=c.off;
  if(sys(k)==='prop'){ const r=propResult(k,c.field,c,true); return showApuracao(k,r,1,()=>finishElection(k,r.win,r)); }
  const r=majResult(k,c.field,c,true);
  showApuracao(k,r,1,()=>{ if(r.second) return showSecondRound(k,r); finishElection(k,r.win,r); });
}
function showSecondRound(k,r1){
  const top2=r1.order.slice(0,2).map(o=>o.c), R=top2.find(c=>!c.isMe);

  let h=`<div class="sheet-scene">${scene('comicio',{seed:'r2'})}<div class="vs">${myPortrait('av-lg')}<b>×</b>${portrait(R,'av-lg')}</div></div><div class="sheet-pad"><div class="eyebrow">2º turno · ${oname(k)} · ${placeName(k)}</div><h2>Você contra ${esc(R.name)}</h2><p class="txt">Você teve ${pct(r1.me.s)} dos votos válidos no 1º turno. Mais quatro semanas. Qual é a estratégia?</p><div class="choices">`;
  P.forEach((p,i)=>h+=`<button class="choice" data-i="${i}"><b>${p.l}</b><small>${p.d}</small>${fxHTML(p.fx)}</button>`);
  openModal(h+'</div></div>',{scene:true});
  document.querySelectorAll('[data-i]').forEach(b=>b.onclick=()=>{ const p=P[+b.dataset.i]; applyFx(p.fx);
    const r2=majResult(k,S.campaign.field,S.campaign,true,top2,p.b); r2.round=2;
    showApuracao(k,r2,2,()=>finishElection(k,r2.win,r2)); });
}
function finishElection(k,win,r){
  const y=S.year, o=OFF[k];
  const desc=r.sys==='prop'?`${fmt(r.votes)} votos`:pct(r.me.s)+(r.round===2?' no 2º turno':'');
  S.elections.push({y,off:k,win,desc,party:PARTIES[S.party].sig});
  if(r.sys!=='prop'){
    const best=r.order.find(x=>!x.c.isMe).c;
    if(best.id===S.nemesis.id){ S.nemesis.elo=(S.nemesis.elo||0)+(win?-1:2); }
    else if(!win||rnd()<.5){ S.rivals=[S.nemesis].concat((S.rivals||[]).filter(r=>r.id!==best.id)).slice(0,2); S.nemesis=Object.assign({},best,{elo:win?0:2,grudge:0,lvl:best.lvl||OFF[k].lvl-1,office:best.office||'none'}); delete S.nemesis.base; delete S.nemesis.mom; log(`${best.name} passa a ser seu principal rival.`); }
  }
  if(win){
    const prev=S.office;
    if(o.type==='exec'&&prev===k) S.execStreak++; else S.execStreak=1;
    if(k==='pres') S.presTerms=prev==='pres'?S.presTerms+1:1;
    if(prev!==k&&prev!=='none') S.career[S.career.length-1].to=y;
    if(prev!==k){ S.stats.ip=Math.max(15,S.stats.ip*0.6); S.career.push({off:k,from:y+1,to:null,party:PARTIES[S.party].sig}); }
    S.office=k; S.officeEnds=y+(o.yrs||4); S.maxLvl=Math.max(S.maxLvl,o.lvl); S.lostStreak=0;
    S.stats.cp=clamp(S.stats.cp+6,0,100); S.stats.pt=clamp(S.stats.pt+4,0,100);
    if(o.type==='exec'&&prev!==k){ S.stats.f=clamp(40+rnd()*20,0,100); startCabinet(); log(`Monte seu primeiro escalão na aba Equipe.`,'elec'); }
    if(o.type!=='exec') S.cabinet=null;
    S.allies.forEach(a=>a.loy=clamp(a.loy+8,0,100));
    log(`ELEITO${S.gen==='f'?'A':''}: ${oname(k)} de ${placeName(k)} (${desc}).`,'elec');
  } else {
    S.lostStreak++; S.stats.cp=clamp(S.stats.cp-5,0,100); S.allies.forEach(a=>a.loy=clamp(a.loy-8,0,100));
    log(`Derrota na eleição para ${oname(k)} (${desc}).`,'bad');
  }
  S.lastCampaign={off:k,win,desc,y};
  S.campaign=null; delete S.flags.puxador; TAB='agenda';
  termCheck();
  runQueue();
}
function termCheck(){
  if(S.office!=='none'&&S.officeEnds!=null&&S.officeEnds<=S.year) leaveOffice();
}
function leaveOffice(){
  const was=S.office; if(was==='none') return;
  if(S.career.length&&!S.career[S.career.length-1].to) S.career[S.career.length-1].to=S.year;
  S.office='none'; S.officeEnds=null; S.execStreak=0; S.cabinet=null;
  log(`Mandato de ${OFF[was][S.gen]} encerrado.`);
  if(was==='pres') endPresidency();
}
function endPresidency(){
  const st=S.stats;
  if(st.rj>=85&&st.et<=40) return end('prisao','Sem a imunidade presidencial, a Procuradoria-Geral apresentou a denúncia em uma semana.');
  if(S.presTerms>=2&&AP()>=60&&st.et>=60&&st.f>=50) return end('faixa');
  end('ex_pres');
}

// ---------- escolhas ----------
function resolveChoice(ev,c){
  let branch=c;
  if(c.p!=null){ const p=typeof c.p==='function'?c.p(S.stats):c.p; if(rnd()>=p) branch=Object.assign({},c.fail||{fx:{},r:'Não deu certo.'}); }
  const isDec=S.decOpen!=null; const [nowFx,laterFx]=isDec?splitFx(branch.fx):[branch.fx,null];
  const out=applyFx(nowFx); if(laterFx) S.pending.push({due:S.tick+2+Math.floor(rnd()*2),fx:laterFx,src:genderize(fill(ev.t))});
  noteAttention(out, ev.who&&S.allies.includes(ev.who)?'ally':null); if(branch.promise) addPromise(branch.promise); if(branch.obra) addObra(branch.obra); if(branch.grudge&&S.nemesis) S.nemesis.grudge=(S.nemesis.grudge||0)+branch.grudge;
  { let net=0; for(const k in out){ if(k==='$') net+=Math.sign(out[k]); else if(!k.startsWith('h:')) net+=(isBad(k,out[k])?-1:1); } (net>=0&&branch===c)?SFX.good():SFX.bad(); }
  if(branch.fn) branch.fn(); else if(branch===c&&c.fn) c.fn();
  if(c.set&&branch===c) S.flags[c.set]=1; if(c.unset) delete S.flags[c.unset];
  if(c.ally&&branch===c) addAlly(c.ally.t,c.ally);
  const txt=genderize(fill(branch.r||''));
  { const mag=Object.entries(out).reduce((a,[k,v])=>a+(k==='$'||k.startsWith('h:')?0:Math.abs(v)),0); (S.bioLog=S.bioLog=S.bioLog||[]).push({y:S.year,q:S.q,tick:S.tick,t:genderize(fill(ev.t)),l:genderize(fill(c.l)),ok:branch===c,mag,et:(out.et||0),rj:(out.rj||0),off:S.office,tone:S.decOpen!=null&&S.dec&&S.dec[S.decOpen]?S.dec[S.decOpen].tone:null}); if(S.bioLog.length>160) S.bioLog.shift(); }
  const sc=Object.entries(out).reduce((a,[k,v])=>a+(k==='$'?0:Math.abs(v)),0);
  (S.qNews=S.qNews||[]).push({t:genderize(fill(ev.t)),r:txt,sc,crise:['_julgamento','_escandalo','_traicao','_expulsao'].includes(ev.id)});
  if(S.decOpen!=null&&S.dec&&S.dec[S.decOpen]){ S.dec[S.decOpen].done=true; S.dec[S.decOpen].head=txt; S.dec[S.decOpen].title=genderize(fill(ev.t)); S.decOpen=null; }
  log(`${genderize(fill(ev.t))}: ${txt}`, branch===c?'':'bad');
  if(branch.end) end(branch.end);
  showResult(ev,txt,out,branch===c,laterFx);
}

function nextElec(){let y=S.year; while(!(elecType(y)&&(y>S.year||S.q<=2))) y++; return y}
function targetOffice(y){
  const t=elecType(y), el=ORDER.filter(k=>OFF[k].el===t&&eligible(k,y).ok);
  if(!el.length) return ORDER.find(k=>OFF[k].el===t);
  if(el.includes(S.office)&&OFF[S.office].type==='exec') return S.office;
  const up=el.filter(k=>OFF[k].lvl>OFF[S.office].lvl);
  return up[0]||(el.includes(S.office)?S.office:el[el.length-1]);
}
function ensurePre(){
  const y=nextElec(), off=targetOffice(y);
  if(S.pre&&S.pre.y===y&&S.pre.off===off) return;
  S.pre={y,off,field:genField(off)};
}
function publishPoll(){
  if(inCampaign()) return; ensurePre();
  const ap=AP(), k=S.pre.off, p={y:S.year,q:S.q,inst:pick(INST),ap:clamp(ap+randn()*1.5,0,100),seg:{},off:k,ey:S.pre.y};
  for(const s in SEG_SIZE[jurKey()]) p.seg[s]=segAP(s);
  if(S.office!=='none'){ const b=clamp(ap*0.8+randn()*2,2,90), r=clamp((100-ap)*0.55+randn()*2,2,90); p.aval={bom:b,ruim:r,reg:Math.max(0,100-b-r)}; }
  const cc={camp:25,spend:15,effort:regionsFor(k).map(()=>3)};
  if(sys(k)==='prop'){ const r=propResult(k,S.pre.field,cc,false); p.scen={prop:true,votes:r.votes*(1+randn()*.06),cut:r.cut}; }
  else { const r=fieldShares(k,S.pre.field,cc,false); p.scen={s:r.alive.map((c,i)=>({id:c.id,name:c.name,party:c.party,isMe:!!c.isMe,seed:c.seed,gen:c.gen,v:clamp(r.tot[i]+randn()*.015,.005,.95)})).sort((a,b)=>b.v-a.v)}; }
  S.polls.push(p); if(S.polls.length>48) S.polls.shift();
}

function chooseDecision(th,used){
  const fixed=EVENTS.filter(e=>!e.o.camp&&themeOf(e)===th&&whoMatch(e.who)&&!S.seen[e.id]&&!used[e.id]&&(!e.o.req||e.o.req(S.stats)));
  const gens=Object.keys(GENS).filter(g=>GENS[g].th===th&&GENS[g].ok());
  const opts=fixed.map(e=>({kind:'fixed',id:e.id,w:(e.o.w||1)*(e.o.req?2.5:1.1)}));
  gens.forEach(g=>opts.push({kind:'gen',g,w:GENS[g].w*(S.lastGen[th]===g?0.15:1)*(used['g:'+g]?0.05:1)}));
  if(!opts.length) return {kind:'gen',g:'pauta',prm:GENS.pauta.prm()};
  let r=rnd()*opts.reduce((a,o)=>a+o.w,0), ch=opts[opts.length-1];
  for(const o of opts){ r-=o.w; if(r<=0){ ch=o; break; } }
  if(ch.kind==='fixed'){ used[ch.id]=1; S.seen[ch.id]=(S.seen[ch.id]||0)+1; return {kind:'fixed',id:ch.id}; }
  S.lastGen[th]=ch.g; used['g:'+ch.g]=1; return {kind:'gen',g:ch.g,prm:GENS[ch.g].prm()};
}

function oppFromActions(th){
  const cats=S.office==='none'&&th==='gabinete'?['dinheiro','base']:OPP_CATS[th];
  const pool=ACTIONS.filter(a=>cats.includes(a.cat)&&whoMatch(a.who)&&!a.o.camp&&!a.o.special&&!a.o.illegal&&!a.o.req&&!(a.fx.rj>0)&&!((a.fx.et||0)<=-2)&&!(S.onceDone[a.id]));
  const ws=three(pool.filter(a=>!S.oppUsed||!S.oppUsed.includes(a.id))); if(ws.length<3) return null;
  S.oppUsed=(S.oppUsed||[]).concat(ws.map(a=>a.id)).slice(-24);
  return {scene:th==='imprensa'?'imprensa':th==='bastidores'?'skyline':th==='ruas'?'comicio':HOUSE_SCENE[S.office],tag:'Agenda',t:pick(OPP_HEAD[th]),txt:'O trimestre abriu espaço para uma iniciativa. Todas as opções rendem frutos: escolha onde investir seu tempo.',ch:ws.map(a=>({l:genderize(a.n),d:genderize(a.d),fx:toneFx(a.fx,'oport'),r:'Deu certo: '+genderize(a.n).toLowerCase()+'.'}))};
}

  L.filter(a=>a.zone==='aband').sort((a,b)=>b.imp-a.imp).slice(0,3).forEach(a=>out.push({z:'aband',t:`${a.n}: ${a.why}. ${a.since==null?'Nenhuma decisão sua beneficiou essa área até agora.':`Sua última decisão a favor foi há ${a.since} ${a.since===1?'trimestre':'trimestres'}.`}`}));
  L.filter(a=>a.zone==='exag').sort((a,b)=>b.att-a.att).slice(0,2).forEach(a=>out.push({z:'exag',t:`${a.n}: recebeu boa parte das suas escolhas recentes, mas já está em boa situação (${a.why}). Cada ganho rende menos ali.`}));
  return out;
}
function zoneOfAreas(fx){ const L=areaList(), Z={}; L.forEach(a=>Z[a.id]=a); const ab=new Set(), sat=new Set();
  for(const k in fx){ const v=fx[k]; if(!v) continue; let ids=[];
    if(k.startsWith('s:')&&v>0) ids=['seg:'+k.slice(2)]; else if(k.startsWith('o:')&&v>0) ids=['iss:'+k.slice(2)];
    else if(CLS.includes(k)&&v>0){ const ci=CLS.indexOf(k); ids=Object.keys(SEG).filter(s=>SEG[s].mix[ci]>=0.5).map(s=>'seg:'+s); }
    else if(k==='pt'&&v>0) ids=['inst:partido']; else if(k==='ip'&&v>0) ids=['inst:plenario']; else if(k==='et'&&v>0) ids=['inst:imagem']; else if(k==='rj'&&v<0) ids=['inst:justica']; else if(k==='$'&&v>0) ids=['inst:caixa']; else if(k==='f'&&v>0) ids=['inst:contas'];
    ids.forEach(id=>{ const a=Z[id]; if(!a) return; if(a.zone==='aband') ab.add(a.n); else if(a.zone==='exag') sat.add(a.n); }); }
  return {ab:[...ab],sat:[...sat]};
}

  for(const p of S.pending.slice()){ if(p.due<=S.tick){ const out=applyFx(p.fx,{passive:true}); noteAttention(out); S.pending=S.pending.filter(x=>x!==p); log(`Repercussão tardia: ${p.src}.`); } }
  for(const p of S.promises){ if(!p.done&&!p.failed&&S.tick>=p.due){ p.failed=true; applyFx({['s:'+p.seg]:-7,et:-3,['o:'+p.iss]:-4},{passive:true}); log(`Promessa descumprida: ${p.n}.`,'bad'); (S.qNews=S.qNews||[]).push({t:`${S.nome} não cumpre promessa`,r:`Prometeu ${p.n} até ${p.yr} e não entregou.`,sc:7}); } }
  S.promises=S.promises.filter(p=>!(p.done||p.failed)||S.tick-p.due<8);

}

function migrate(o){
  if(!o) return null; if(o.v>SAVE_VER) return null;
  if(!o.v||o.v<5){
    if(!o.world||!o.seg) return null;
    const st=o.stats; for(const k in SEG){ const m=SEG[k].mix; o.seg[k]=clamp(m[0]*(st.aa??30)+m[1]*(st.am??30)+m[2]*(st.apo??30)+(o.seg[k]||0),0,100); }
    delete st.aa; delete st.am; delete st.apo;
    o.promises=o.promises||[]; o.obras=o.obras||[]; o.pending=o.pending||[]; o.att=o.att||{}; o.attLog=o.attLog||[]; o.lastAtt=o.lastAtt||{}; o.hist=o.hist||[]; o.tut=4;
    if(!o.rivals){ o.nemesis.lvl=o.nemesis.lvl||0; o.nemesis.office=o.nemesis.office||'none'; o.rivals=[]; }
    o.v=5;
  }
  if(o.v<6){ ISS_KEYS.forEach(k=>{ if(o.world.heat[k]==null) o.world.heat[k]=12; if(o.world.own[k]==null) o.world.own[k]=50; }); if(!CITIES[o.city]) o.city='caruaru-pe'; o.v=6; }
  const keep=S; S=o; try{ setStateHeat(); if(!S.govs) initGovs(); } finally { S=keep; }
  return o;
}

function confetti(){ if(RM()) return; const cols=['#F2C14E','#2FD08A','#5AA9FF','#FF6B9A','#FFFFFF'];
  for(let i=0;i<70;i++){ const e=document.createElement('i'); e.className='conf'; e.style.left=Math.random()*100+'vw'; e.style.background=cols[i%5]; e.style.animationDuration=(1.8+Math.random()*1.8)+'s'; e.style.animationDelay=(Math.random()*.6)+'s'; document.body.appendChild(e); setTimeout(()=>e.remove(),4200); } }
function showApuracao(k,r,round,done){
  const prop=r.sys==='prop', regs=regionsFor(k), N=electorate(k), valid=N*0.79;
  const start=regs.map(g=>0.35*(1-(g.mix[0]+g.mix[1])/0.9));
  let rows='';
  if(prop){ const all=[{c:{isMe:true,name:S.nome,party:S.party},v:r.votes}].concat(r.rivals.map(x=>({c:x.c,v:x.votes}))); r._rows=all; const mx=Math.max(...all.map(x=>x.v),r.cut)*1.2; r._mx=mx;
    rows=all.map((x,i)=>`<div class="cand-row">${x.c.isMe?myPortrait('av-sm'):portrait(x.c,'av-sm')}<div class="nm"><b>${esc(x.c.name)}</b><small>${x.c.isMe?'Você':'Colega de chapa'}</small></div><div class="pc" id="pv${i}">0</div><div class="tr" style="position:relative"><i id="pb${i}" style="width:0;transition:none;background:${x.c.isMe?'var(--gold)':'#6B7A99'}"></i><span class="cutline" style="left:${r.cut/mx*100}%"></span></div></div>`).join('');
  } else { r._alive=r.shares.alive;
    rows=r._alive.map((c,i)=>`<div class="cand-row">${c.isMe?myPortrait('av-sm'):portrait(c,'av-sm')}<div class="nm"><b>${esc(c.name)}</b><small>${PARTIES[c.party].sig}</small></div><div class="pc" id="pv${i}">0,0%</div><div class="tr"><i id="pb${i}" style="width:0;transition:none;background:${candColor(c,i)}"></i></div></div>`).join(''); }
  const h=`<div class="sheet-scene" style="height:110px">${scene('urna',{seed:'apu'+round})}</div><div class="sheet-pad"><div class="eyebrow">Totalização · Justiça Eleitoral${round===2?' · 2º turno':''}</div><h2>${oname(k)} · ${esc(placeName(k))}</h2>
   <div class="apu"><div class="prog"><span>Seções apuradas</span><span id="apuPct">0,00%</span></div><div class="bar gold"><i id="apuBar" style="width:0;transition:none"></i></div>
   <div id="apuMap">${mapHTML(regs,regs.map(()=>'#1D2A44'),[],-1,false)}</div>${rows}${prop?`<p class="muted" style="margin:0;font-size:12.5px">Linha dourada: corte estimado da legenda (${fmt(r.cut)} votos). Quociente eleitoral: ${fmt(r.qe)}.</p>`:''}</div><div id="apuEnd"></div></div>`;
  openModal(h);
  const t0=performance.now(), D=RM()?1:4200;
  function frame(now){
    if(!$('#apuPct')) return;
    const t=clamp((now-t0)/D,0,1), e=1-Math.pow(1-t,1.6);
    const cf=start.map(s=>clamp((e-s)/(1-s),0,1)); const W=regs.reduce((a,g,i)=>a+g.w*cf[i],0)||1e-9;
    $('#apuPct').textContent=(regs.reduce((a,g,i)=>a+g.w*cf[i],0)*100).toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2})+'%'; $('#apuBar').style.width=(W*100)+'%';
    let fills, labels=[];
    if(prop){ r._rows.forEach((x,i)=>{ const v=x.c.isMe?r.regVotes.reduce((a,rv,ri)=>a+rv*cf[ri],0):x.v*W; $('#pv'+i).textContent=fmt(v); $('#pb'+i).style.width=(v/r._mx*100)+'%'; });
      const tot=r.regVotes.reduce((a,b)=>a+b,0); fills=r.regVotes.map((v,i)=>cf[i]>0.02?`rgba(242,193,78,${(0.15+0.8*Math.min(1,v/tot*3)*cf[i]).toFixed(2)})`:'#1D2A44'); labels=r.regVotes.map((v,i)=>cf[i]>0.02?fmt(v*cf[i]):'');
    } else { const P=r.shares.perReg; const tot=r._alive.map((c,ci)=>regs.reduce((a,g,ri)=>a+g.w*cf[ri]*P[ri][ci],0)/W);
      r._alive.forEach((c,i)=>{ $('#pv'+i).textContent=pct(tot[i]); $('#pb'+i).style.width=(tot[i]*100)+'%'; });
      fills=regs.map((g,ri)=>{ if(cf[ri]<0.02) return '#1D2A44'; let bi=0; P[ri].forEach((v,i)=>{if(v>P[ri][bi])bi=i}); const c=r._alive[bi]; const op=(0.3+0.7*cf[ri]); return c.isMe?`rgba(242,193,78,${op.toFixed(2)})`:hexA(PCOLOR[c.party],op); });
      const mi=r._alive.findIndex(c=>c.isMe); labels=regs.map((g,ri)=>cf[ri]>0.02?'você '+Math.round(P[ri][mi]*100)+'%':''); }
    $('#apuMap').innerHTML=mapHTML(regs,fills,labels,-1,false);
    if(t<1){ if(now-(frame.lt||0)>90){ frame.lt=now; SFX.tick(); } return requestAnimationFrame(frame); }
    SFX.stamp(); setTimeout(()=>r.win?SFX.win():r.second?SFX.open():SFX.lose(),250);
    const g=S.gen==='f'?'a':'';
    const st=r.win?`<span class="stamp win">Eleit${g||'o'}</span>`:r.second?'<span class="stamp mid">2º turno</span>':`<span class="stamp lose">Não eleit${g||'o'}</span>`;
    const extra=prop?`<p class="muted" style="margin:0">Sua votação: <b class="mono">${fmt(r.votes)}</b> votos. Corte: ${fmt(r.cut)}.</p>`:`<p class="muted" style="margin:0">${fmt(valid*r.me.s)} votos de ${fmt(valid)} válidos.</p>`;
    $('#apuEnd').innerHTML=`<div style="display:flex;flex-direction:column;gap:12px;padding-top:6px">${st}${extra}<button class="cta" id="apuOk">${r.second?'Ir para o 2º turno':'Continuar'}</button></div>`;
    if(r.win) confetti();
    $('#apuOk').onclick=done; $('#apuOk').focus();
  }
  requestAnimationFrame(frame);
}
