<title>Vossa Excelência</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,500;0,6..96,700;0,6..96,800;1,6..96,500;1,6..96,700&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* Layout: HUD de gabinete noturno — cenário do prédio do cargo com retrato, mostradores circulares, abas no rodapé como app; folhas com ilustração para histórias, sala de guerra com mapa e pesquisas */
:root{
  color-scheme:dark;
  --bg:#090E1A; --panel:#101828; --panel2:#162136; --panel3:#1D2A44; --line:#243250; --ink:#EAEFF8; --muted:#8D9AB6; --faint:#5D6A87;
  --gold:#F2C14E; --gold-ink:#1A1405; --cyan:#38BDF8; --violet:#A78BFA; --teal:#2DD4BF; --slate:#94A3B8; --orange:#FB923C; --lime:#A3E635; --green:#2FD08A; --red:#FF6363; --blue:#5AA9FF; --paper:#EFE8D8; --paper-ink:#1D1A14;
  --display:'Bodoni Moda', Didot, 'Bodoni 72', Georgia, serif;
  --body:'IBM Plex Sans', system-ui, -apple-system, 'Segoe UI', sans-serif;
  --mono:'IBM Plex Mono', ui-monospace, Menlo, Consolas, monospace;
}
*{box-sizing:border-box}
html,body{background:var(--bg)}
body{color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.5;background:radial-gradient(1200px 500px at 50% -120px,#18264A 0%,var(--bg) 70%) fixed,var(--bg)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:60;background:var(--bg)}
button{font:inherit;color:inherit}
button:focus-visible,input:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.wrap{max-width:1120px;margin:0 auto;padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px));padding-block:12px 150px}
h1,h2,h3{font-family:var(--display);font-weight:700;text-wrap:balance;margin:0;line-height:1.08}
.eyebrow{font-family:var(--mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--gold)}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:6px;vertical-align:1px}
.scene{display:block;width:100%;height:100%}
.avatar{display:block;width:100%;height:100%;border-radius:50%}
.av-sm{width:34px;height:34px;flex:none}.av-md{width:48px;height:48px;flex:none}.av-lg{width:72px;height:72px;flex:none}.av-xl{width:84px;height:84px;flex:none}

/* animações */
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes pop{0%{transform:scale(.6);opacity:0}70%{transform:scale(1.08);opacity:1}100%{transform:scale(1)}}
@keyframes floatUp{0%{opacity:0;transform:translateY(6px)}15%{opacity:1}100%{opacity:0;transform:translateY(-22px)}}
@keyframes twinkle{0%,100%{opacity:.15}50%{opacity:.9}}
@keyframes wave{0%,100%{transform:skewY(0)}50%{transform:skewY(-6deg)}}
@keyframes blink{0%,49%{opacity:1}50%,100%{opacity:.15}}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-2.5px)}}
@keyframes smoke{0%{transform:translateY(0) scale(.8);opacity:.5}100%{transform:translateY(-40px) scale(1.6);opacity:0}}
@keyframes spot{0%,100%{opacity:.35}50%{opacity:.8}}
@keyframes flash{0%,88%,100%{opacity:0}90%{opacity:.55}}
@keyframes rainf{from{transform:translate(0,-12px)}to{transform:translate(-4px,12px)}}
@keyframes waves{0%,100%{transform:translateX(0)}50%{transform:translateX(-12px)}}
@keyframes stamp{0%{transform:scale(2.6) rotate(-14deg);opacity:0}60%{transform:scale(.94) rotate(-5deg);opacity:1}100%{transform:scale(1) rotate(-5deg);opacity:1}}
@keyframes confetti{0%{transform:translateY(-20px) rotate(0)}100%{transform:translateY(110vh) rotate(720deg)}}
@keyframes sheetIn{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes qIn{0%{opacity:0;letter-spacing:.4em}100%{opacity:1;letter-spacing:.06em}}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(242,193,78,.5)}50%{box-shadow:0 0 0 8px rgba(242,193,78,0)}}
.tw{animation:twinkle 3s ease-in-out infinite}
.wave{animation:wave 2.4s ease-in-out infinite}
.blink{animation:blink .7s steps(1) infinite}.blink2{animation:blink .7s steps(1) infinite .35s}
.bob{animation:bob 1.6s ease-in-out infinite}
.smoke{animation:smoke 3.2s ease-out infinite}
.spot{animation:spot 2.6s ease-in-out infinite}
.flash{animation:flash 3s linear infinite}
.rain{animation:rainf .5s linear infinite}
.wavey{animation:waves 3s ease-in-out infinite}
.rise{animation:rise .45s cubic-bezier(.2,.7,.2,1) both;animation-delay:calc(var(--i,0)*40ms)}

/* ---------- início ---------- */
.hero{position:relative;border-radius:14px;overflow:hidden;height:250px;border:1px solid var(--line)}
.hero .scene{position:absolute;inset:0}
.hero .over{position:absolute;inset:auto 0 0 0;padding:20px;background:linear-gradient(transparent,rgba(5,8,16,.92) 60%)}
.hero h1{font-size:clamp(40px,10vw,74px);font-style:italic;font-weight:700;letter-spacing:-.01em;color:#fff}
.hero .sub{font-family:var(--display);font-size:clamp(17px,3.6vw,22px);color:var(--gold);font-style:italic}
.intro{display:grid;gap:26px}
.lead{max-width:62ch;color:var(--muted);margin:0}
.step{display:grid;gap:12px}
.step h2{font-size:24px}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.idcard{display:flex;gap:16px;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px;flex-wrap:wrap}
.field{display:flex;flex-direction:column;gap:6px;flex:1 1 220px;min-width:0}
.field input{padding:12px 14px;border:1px solid var(--line);border-radius:8px;background:var(--panel2);color:var(--ink);font:inherit;font-size:16px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;flex-wrap:wrap}
.seg button{border:0;background:var(--panel2);padding:10px 14px;cursor:pointer;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--gold);color:var(--gold-ink);font-weight:600}
.picks{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}
.pick{border:1px solid var(--line);background:var(--panel);border-radius:12px;padding:0;text-align:left;cursor:pointer;display:flex;flex-direction:column;overflow:hidden;min-width:0;transition:transform .2s,border-color .2s}
.pick:hover{transform:translateY(-2px);border-color:var(--faint)}
.pick[aria-pressed="true"]{border-color:var(--gold);box-shadow:0 0 0 1px var(--gold),0 10px 30px rgba(242,193,78,.12)}
.pick .thumb{height:96px}
.pick .pb{padding:12px 14px;display:flex;flex-direction:column;gap:6px}
.pick b{font-family:var(--display);font-size:20px}
.pick .kv{display:grid;grid-template-columns:auto 1fr;gap:2px 10px;font-size:12.5px}
.pick .kv span:nth-child(odd){color:var(--muted)}
.pick small{color:var(--muted);font-size:12.5px}
.pstripe{height:6px}
.chips-sel{display:flex;flex-wrap:wrap;gap:8px}
.chip-sel{border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:9px 15px;cursor:pointer}
.chip-sel[aria-pressed="true"]{background:var(--gold);color:var(--gold-ink);border-color:var(--gold);font-weight:600}
.cta{background:var(--gold);color:var(--gold-ink);border:0;border-radius:10px;padding:13px 22px;font-weight:700;cursor:pointer;font-size:15.5px;transition:transform .12s,filter .2s}
.cta:hover{filter:brightness(1.07)}.cta:active{transform:scale(.97)}
.cta:disabled{opacity:.4;cursor:not-allowed}
.ghost{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:10px 16px;cursor:pointer;color:var(--ink)}
.ghost:disabled{opacity:.4;cursor:not-allowed}
.ghost.sm{padding:7px 11px;font-size:13px;border-radius:8px}

/* ---------- HUD ---------- */
.hud{position:relative;border-radius:14px;overflow:hidden;border:1px solid var(--line);min-height:168px}
.hud .scene{position:absolute;inset:0}
.hud .shade{position:absolute;inset:0;background:linear-gradient(180deg,rgba(6,9,18,.1),rgba(6,9,18,.88) 78%)}
.hud-in{position:relative;display:flex;gap:14px;align-items:flex-end;padding:70px 14px 14px;flex-wrap:wrap}
.hud .id{display:flex;flex-direction:column;gap:2px;min-width:0;flex:1 1 180px}
.hud .trat{font-family:var(--mono);font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--gold)}
.hud h1{font-size:clamp(24px,6vw,34px);font-style:italic;font-weight:700;color:#fff}
.hud .cargo{font-size:14px;color:#C9D2E6}
.pchip{display:inline-flex;align-items:center;gap:6px;font-family:var(--mono);font-size:11.5px;padding:3px 9px;border-radius:999px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.12);width:max-content}
.datebox{display:flex;flex-direction:column;align-items:flex-end;font-family:var(--mono);color:#C9D2E6;font-size:12px;text-align:right}
.datebox b{font-family:var(--display);font-size:22px;color:#fff;font-weight:700}
.gauges{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin-top:10px}
.gauge{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px 6px 8px;display:flex;flex-direction:column;align-items:center;gap:2px;position:relative;min-width:0}
.gauge svg{width:64px;height:64px}
.gauge .ring{transition:stroke-dashoffset 1s cubic-bezier(.2,.8,.2,1)}
.gauge .v{position:absolute;top:30px;font-family:var(--mono);font-size:15px;font-weight:600}
.gauge .l{font-size:11px;color:var(--muted);text-align:center;letter-spacing:.04em}
.bars{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin-top:8px}
@media (max-width:640px){.bars{grid-template-columns:repeat(2,minmax(0,1fr))}.gauge svg{width:56px;height:56px}.gauge .v{top:26px;font-size:14px}}
.mbar{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:8px 10px;display:flex;flex-direction:column;gap:5px;position:relative;min-width:0}
.mbar .t{display:flex;justify-content:space-between;gap:6px;align-items:baseline;font-size:11.5px;color:var(--muted)}
.mbar .t b{font-family:var(--mono);color:var(--ink);font-size:14px;font-weight:600;white-space:nowrap}
.bar{height:6px;background:var(--panel3);border-radius:4px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--green);border-radius:4px;transition:width .8s cubic-bezier(.2,.8,.2,1)}
.bar.risk i{background:var(--red)}.bar.gold i{background:var(--gold)}.bar.blue i{background:var(--blue)}
.bar.big{height:12px}
.dlt{position:absolute;right:8px;top:4px;font-family:var(--mono);font-size:12px;font-weight:600;pointer-events:none;animation:floatUp 1.8s ease-out forwards}
.dlt.up{color:var(--green)}.dlt.dn{color:var(--red)}
.sub3{display:flex;gap:6px;font-family:var(--mono);font-size:10px;color:var(--muted);margin-top:2px}
.notice{margin-top:10px;border:1px solid var(--line);background:var(--panel);border-radius:10px;padding:10px 12px;font-size:13.5px;display:flex;gap:10px;flex-wrap:wrap;justify-content:space-between;align-items:center}
.notice.hot{border-color:var(--gold);background:linear-gradient(90deg,rgba(242,193,78,.12),var(--panel))}

/* ---------- conteúdo ---------- */
.sect{display:grid;gap:12px;margin-top:16px}
.sect>h2{font-size:22px;display:flex;align-items:center;gap:10px}
.cats{display:flex;gap:6px;overflow-x:auto;padding-block:4px 6px;scrollbar-width:none}
.cats::-webkit-scrollbar{display:none}
.cats button{border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:7px 12px;font-size:13px;cursor:pointer;white-space:nowrap;display:flex;align-items:center;gap:6px;color:var(--muted)}
.cats button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.cats .n{font-family:var(--mono);font-size:11px;opacity:.7}
.ico{width:18px;height:18px;flex:none}
.acts{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:10px}
@media (max-width:420px){.acts{grid-template-columns:1fr}}
.act{border:1px solid var(--line);background:var(--panel);border-radius:12px;padding:12px;text-align:left;cursor:pointer;display:grid;grid-template-columns:38px 1fr;gap:4px 12px;min-width:0;transition:transform .15s,border-color .15s,background .15s}
.act:hover:not(:disabled){border-color:var(--gold);background:var(--panel2);transform:translateY(-1px)}
.act:active:not(:disabled){transform:scale(.98)}
.act:disabled{cursor:not-allowed;opacity:.42}
.act .ic{grid-row:span 3;width:38px;height:38px;border-radius:10px;display:grid;place-items:center}
.act .h{display:flex;justify-content:space-between;gap:8px;align-items:baseline;min-width:0}
.act .h b{font-weight:600;font-size:14.5px}
.act .cost{font-family:var(--mono);font-size:11px;color:var(--muted);white-space:nowrap}
.act p{margin:0;font-size:13px;color:var(--muted)}
.act .why{font-size:12px;color:var(--red)}
.fx{display:flex;flex-wrap:wrap;gap:4px}
.fx span{font-family:var(--mono);font-size:11px;padding:2px 7px;border-radius:5px;background:var(--panel3);white-space:nowrap}
.fx .g{color:var(--green)}.fx .b{color:var(--red)}.fx .w{color:var(--gold)}
.res .fx span{animation:pop .4s both}
.res .fx span:nth-child(2){animation-delay:.08s}.res .fx span:nth-child(3){animation-delay:.16s}.res .fx span:nth-child(4){animation-delay:.24s}.res .fx span:nth-child(5){animation-delay:.32s}

.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:10px;min-width:0}
.card h3{font-size:18px}
.card .hd{display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
@media (max-width:760px){.grid2{grid-template-columns:1fr}}
.week{display:grid;grid-template-columns:repeat(6,1fr);gap:4px}
.week span{height:30px;border-radius:6px;background:var(--panel3);display:grid;place-items:center;font-family:var(--mono);font-size:11px;color:var(--muted)}
.week span.done{background:rgba(242,193,78,.25);color:var(--gold)}
.week span.now{background:var(--gold);color:var(--gold-ink);font-weight:700;animation:pulse 2s infinite}
.cand-row{display:grid;grid-template-columns:34px 1fr auto;gap:10px;align-items:center}
.cand-row .nm{min-width:0}
.cand-row .nm b{font-size:13.5px;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cand-row .nm small{font-size:11px;color:var(--muted)}
.cand-row .pc{font-family:var(--mono);font-weight:600;font-size:15px;text-align:right}
.cand-row .pc small{display:block;font-size:10.5px;font-weight:400}
.tr{height:8px;background:var(--panel3);border-radius:4px;overflow:hidden;grid-column:2 / 4}
.tr i{display:block;height:100%;border-radius:4px;transition:width .9s cubic-bezier(.2,.8,.2,1)}
.mapsvg{width:100%;height:auto;display:block}
.mapsvg path{stroke:var(--bg);stroke-width:3;cursor:pointer;transition:fill .5s,opacity .5s}
.mapsvg path.focus{stroke:var(--gold);stroke-width:3.5}
.mapsvg text{font-family:var(--mono);font-size:10px;fill:#fff;pointer-events:none;text-anchor:middle}
.verba{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.verba button{border:1px solid var(--line);background:var(--panel2);border-radius:10px;padding:9px 6px;cursor:pointer;display:flex;flex-direction:column;gap:2px;align-items:center;text-align:center}
.verba button[aria-pressed="true"]{border-color:var(--gold);background:rgba(242,193,78,.14)}
.verba b{font-size:13px}.verba small{font-size:11px;color:var(--muted)}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.kpi{background:var(--panel2);border-radius:10px;padding:8px;display:flex;flex-direction:column;gap:2px}
.kpi small{font-size:10.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.kpi b{font-family:var(--mono);font-size:16px}
.rivals{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px}
.rival{display:flex;gap:10px;align-items:center;background:var(--panel2);border-radius:12px;padding:10px;min-width:0}
.rival.out{opacity:.4}
.rival b{display:block;font-size:14px}.rival small{display:block;font-size:12px;color:var(--muted)}
.chart{width:100%;height:auto;display:block}
.chart text{font-family:var(--mono);font-size:10px;fill:var(--muted)}

.allies{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:10px}
.ally{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:8px}
.ally .top{display:flex;gap:10px;align-items:center}
.ally b{font-size:14.5px;display:block}.ally small{font-size:12px;color:var(--muted);display:block}
.stars{color:var(--gold);font-size:12px;letter-spacing:1px}
.tag{font-family:var(--mono);font-size:10.5px;padding:2px 6px;border-radius:4px;background:rgba(255,99,99,.15);color:var(--red)}
.ally .btns{display:flex;gap:6px;flex-wrap:wrap}
.addcard{border:1.5px dashed var(--line);background:transparent;border-radius:14px;padding:16px;cursor:pointer;display:flex;flex-direction:column;gap:4px;align-items:center;justify-content:center;color:var(--muted);min-height:120px}
.addcard:hover{border-color:var(--gold);color:var(--gold)}
.staff{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:8px}
.staffc{border:1px solid var(--line);background:var(--panel);border-radius:12px;padding:12px;text-align:left;cursor:pointer;display:flex;flex-direction:column;gap:4px}
.staffc[aria-pressed="true"]{border-color:var(--green);background:linear-gradient(180deg,rgba(47,208,138,.1),var(--panel))}
.staffc b{font-size:14px}.staffc small{color:var(--muted);font-size:12.5px}
.hemi{width:100%;max-width:360px;height:auto;display:block;margin:0 auto}
.slots{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:8px}
.slot{border:1px solid var(--line);background:var(--panel);border-radius:12px;padding:10px;text-align:left;cursor:pointer;display:flex;gap:10px;align-items:center;min-width:0}
.slot:hover{border-color:var(--gold)}
.slot.empty{border-style:dashed;border-color:var(--red)}
.slot .sn{min-width:0;flex:1}.slot b{font-size:13.5px;display:block}.slot small{font-size:11.5px;color:var(--muted);display:block}
.ph{width:48px;height:48px;border-radius:50%;background:var(--panel3);display:grid;place-items:center;color:var(--red);font-size:22px;flex:none}

.paper{background:var(--paper);color:var(--paper-ink);border-radius:6px;padding:16px 18px;display:flex;flex-direction:column;gap:8px;box-shadow:0 10px 30px rgba(0,0,0,.35)}
.paper .mast{display:flex;justify-content:space-between;align-items:baseline;border-bottom:3px double var(--paper-ink);padding-bottom:6px;gap:8px;flex-wrap:wrap}
.paper .mast b{font-family:var(--display);font-size:20px;font-weight:800;letter-spacing:.02em}
.paper .mast span{font-family:var(--mono);font-size:10.5px}
.paper h3{font-family:var(--display);font-size:clamp(20px,4.6vw,26px);font-weight:800;line-height:1.1}
.paper .cols{columns:2 220px;column-gap:18px;font-size:13.5px;font-family:Georgia,serif}
.paper .cols p{margin:0 0 8px;break-inside:avoid}
.timeline{display:flex;flex-direction:column;gap:0;border-left:2px solid var(--line);margin-left:8px}
.tl{position:relative;padding:6px 0 14px 18px}
.tl::before{content:"";position:absolute;left:-7px;top:10px;width:12px;height:12px;border-radius:50%;background:var(--gold);box-shadow:0 0 0 3px var(--bg)}
.tl b{font-family:var(--display);font-size:18px}.tl small{display:block;color:var(--muted);font-family:var(--mono);font-size:12px}
.tbl-wrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:13.5px}
th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
th{font-weight:500;color:var(--muted);font-size:11px;letter-spacing:.08em;text-transform:uppercase}
td.n{font-family:var(--mono);font-variant-numeric:tabular-nums;text-align:right}
.prose{max-width:68ch;display:grid;gap:10px}
.prose h3{font-size:20px;margin-top:8px}
.prose p,.prose li{margin:0;font-size:14.5px}
.prose ul{margin:0;padding-left:18px;display:grid;gap:4px}
